name: No Plaintext Secrets

# Fails when a tracked manifest under manifests/ or apps/ is a Kubernetes Secret with a non-empty
# data or stringData block. Every Secret the cluster reads comes from a SealedSecret
# (manifests/sealed-secrets/), so a plain Secret here is either a leak or a second writer.
# ALLOWED lists the two files that hold no secret material (a public CA certificate and
# placeholders). The global gitleaks hook still blocks literal tokens.

on:
  pull_request:
    paths: ['manifests/**', 'apps/**']
  push:
    branches: [main]
    paths: ['manifests/**', 'apps/**']

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for plain Secret manifests
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml
          ALLOWED = {
              "manifests/marketflow-cloudflare-origin-pull-ca.yaml",  # Cloudflare's public origin-pull CA
              "manifests/argocd-notifications/secret.yaml",           # placeholders only
          }
          bad = []
          for p in sorted(pathlib.Path(".").glob("manifests/**/*.y*ml")) + sorted(pathlib.Path(".").glob("apps/**/*.y*ml")):
              rel = p.as_posix()
              if rel in ALLOWED:
                  continue
              try:
                  docs = list(yaml.safe_load_all(p.read_text(encoding="utf-8")))
              except Exception as e:
                  print(f"::warning file={rel}::not parsed as YAML ({type(e).__name__}); skipped")
                  continue
              for d in docs:
                  if isinstance(d, dict) and d.get("kind") == "Secret" and (d.get("data") or d.get("stringData")):
                      bad.append(rel)
          for rel in bad:
              print(f"::error file={rel}::plain Secret with data; seal it (scripts/sealing/seal-from-live.sh or seal-keys.sh) instead")
          sys.exit(1 if bad else 0)
          PY
