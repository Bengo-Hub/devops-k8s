name: Sealed Secrets Drift Check

# Nightly, read-only. Fails (and so notifies) when a Secret owned by a SealedSecret was written by
# anything other than the controller after its last sync (that write is lost at the next controller
# restart, every node reboot), or when a SealedSecret is not Synced. Opaque Secrets with no
# SealedSecret are listed as warnings. Never reads a value. See scripts/sealing/check-sealed-drift.sh.

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DevOps tools (kubectl)
        uses: ./.github/actions/install-devops-tools
        with:
          install_trivy: 'false'

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config" 2>/dev/null || echo "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --request-timeout=20s >/dev/null

      - name: Check drift
        run: |
          set -o pipefail
          bash scripts/sealing/check-sealed-drift.sh | tee drift.txt
          { echo "## Sealed Secrets drift"; echo '```'; cat drift.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
