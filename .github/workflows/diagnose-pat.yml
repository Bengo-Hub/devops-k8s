name: Diagnose PAT
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe each token (values are never printed)
        env:
          GH_PAT_V: ${{ secrets.GH_PAT }}
          PROPAGATE_V: ${{ secrets.PROPAGATE_PAT }}
        run: |
          for n in GH_PAT_V PROPAGATE_V; do
            t="${!n}"
            echo "== $n len=${#t} prefix=${t:0:4} trailing_ws=$([[ "$t" =~ [[:space:]]$ ]] && echo yes || echo no)"
            [ -z "$t" ] && continue
            curl -sS -D - -o /dev/null -H "Authorization: Bearer $t" https://api.github.com/repos/Bengo-Hub/devops-k8s \
              | grep -iE "^HTTP|x-oauth-scopes|token-expiration|x-ratelimit-remaining" || true
            curl -sS -H "Authorization: Bearer $t" https://api.github.com/repos/Bengo-Hub/devops-k8s | grep -E '"push"|"admin"' || true
            rm -rf probe && git clone -q --depth 1 "https://${t}@github.com/Bengo-Hub/devops-k8s.git" probe 2>&1 | sed "s/${t}/***/g" | head -3
            (cd probe && git push --dry-run origin HEAD:main 2>&1 | sed "s/${t}/***/g" | head -4)
          done
