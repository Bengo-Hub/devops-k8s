name: Registry credentials (sealed)

# Seals the image pull Secret "registry-credentials" (type kubernetes.io/dockerconfigjson) for each
# listed namespace from the REGISTRY_* repository secrets into
# manifests/sealed-secrets/<ns>/registry-credentials.sealedsecret.yaml, commits and pushes, then
# waits for the controller to sync. This is the only writer of those Secrets: provision.yml and the
# service build.sh files skip a registry-credentials Secret that a SealedSecret owns.
# Run it after rotating the Docker Hub token (update REGISTRY_PASSWORD first). Values only pass
# through env vars and pipes and are never printed. Pull secrets are read at image pull time, so
# no restart is needed.

on:
  workflow_dispatch:
    inputs:
      namespaces:
        description: 'Namespaces that get registry-credentials (empty = every namespace that already has a sealed file)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: registry-credentials
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      REGISTRY_EMAIL: ${{ secrets.REGISTRY_EMAIL }}
      REGISTRY_SERVER: docker.io
      NAMESPACES: ${{ inputs.namespaces }}
    steps:
      - name: Check secrets
        run: |
          for v in KUBE_CONFIG_B64 REGISTRY_USERNAME REGISTRY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; exit 1; fi
          done

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROPAGATE_PAT || secrets.GH_PAT }}

      - uses: azure/setup-kubectl@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | tr -d '[:space:]' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --request-timeout=20s >/dev/null

      - name: Seal, commit and sync registry-credentials
        env:
          GIT_USER: registry-credentials-workflow
          GIT_EMAIL: devops-bot@users.noreply.github.com
        run: |
          set -euo pipefail
          source scripts/sealing/seal-lib.sh
          ensure_kubeseal
          if [ -z "${NAMESPACES// }" ]; then
            NAMESPACES=$(ls manifests/sealed-secrets/*/registry-credentials.sealedsecret.yaml | awk -F/ '{print $(NF-1)}' | xargs)
          fi
          targets=()
          for ns in $NAMESPACES; do
            if ! kubectl get namespace "$ns" >/dev/null 2>&1; then
              echo "::warning::namespace $ns does not exist, skipped"; continue
            fi
            targets+=("$ns")
          done
          (( ${#targets[@]} > 0 )) || { echo "::error::no namespace to seal"; exit 1; }
          email_arg=()
          [ -n "${REGISTRY_EMAIL:-}" ] && email_arg=(--docker-email="$REGISTRY_EMAIL")
          kubectl create secret docker-registry registry-credentials \
            --docker-server="$REGISTRY_SERVER" \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_PASSWORD" \
            "${email_arg[@]}" \
            --dry-run=client -o json \
            | bash scripts/sealing/seal-from-github-secret.sh "${targets[@]}"
          # Existing Secrets not yet owned by a SealedSecret are adopted (metadata only).
          for ns in "${targets[@]}"; do
            if kubectl get secret registry-credentials -n "$ns" >/dev/null 2>&1 && [ -z "$(sealed_owner "$ns" registry-credentials)" ]; then
              mark_adoptable "$ns" registry-credentials
            fi
          done
          git_commit_push . "secrets(registry-credentials): seal for ${targets[*]}" manifests/sealed-secrets
          refresh_sealed_app
          for ns in "${targets[@]}"; do wait_synced "$ns" registry-credentials; done
          rm -f ~/.kube/config
