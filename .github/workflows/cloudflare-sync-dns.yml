name: Sync Cloudflare DNS

on:
  workflow_dispatch:
    inputs:
      zone_id:
        description: 'Cloudflare zone ID (codevertexafrica.com = dbbf1a40cb82ffd43dbc1405d3d8a4b1); for hadia-zone.py pass hadiafrica.com'
        required: true
        type: string
      script:
        description: 'Script to run'
        required: false
        type: choice
        default: populate-zone.py
        options:
          - populate-zone.py
          - set-proxied.py
          - hadia-zone.py
      mode:
        description: 'hadia-zone.py only: list, plan (no changes) or apply'
        required: false
        type: choice
        default: plan
        options:
          - list
          - plan
          - apply

# populate-zone.py and set-proxied.py are written for codevertexafrica.com only: never run them
# against another zone. populate-zone.py only creates missing records and corrects mismatched
# content on records it owns (A/CNAME/MX/TXT for its host list); it never deletes anything.
# hadia-zone.py manages hadiafrica.com's web records only: it checks the zone name, never deletes
# or modifies a record, and never touches MX or TXT (the mail setup stays as it is).

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_MODE: ${{ inputs.mode }}
        run: python3 "scripts/cloudflare/${{ inputs.script }}" "${{ inputs.zone_id }}"
