name: Sync Cloudflare DNS

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Zone to sync (each has its own module in scripts/cloudflare/zones/)'
        required: true
        type: choice
        options:
          - codevertexafrica.com
          - hadiafrica.com
      action:
        description: 'records: create missing and correct owned records; proxied: flip listed hosts to proxied'
        required: false
        type: choice
        default: records
        options:
          - records
          - proxied
      mode:
        description: 'plan prints the changes without making them; list prints every record; apply makes the changes'
        required: false
        type: choice
        default: plan
        options:
          - plan
          - list
          - apply

# scripts/cloudflare/sync-zone.py resolves the zone from the chosen domain's own module by NAME and
# checks it against Cloudflare, so one domain's records can never be written into another zone.
# Nothing is ever deleted; existing records' proxied state is only changed by action=proxied.
# Run mode=plan first and review the output before mode=apply.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync-zone.py
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 scripts/cloudflare/sync-zone.py "${{ inputs.domain }}" --action "${{ inputs.action }}" --mode "${{ inputs.mode }}"
