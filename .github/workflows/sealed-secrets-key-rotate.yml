name: Sealed Secrets Key Rotate / Refresh Backup

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'refresh_backup = re-export current key(s) to the GitHub secret only. rotate = restart the controller first (lets its own auto-rotation logic generate a new key if the configured period has elapsed), then refresh the backup either way.'
        required: true
        type: choice
        default: refresh_backup
        options:
          - refresh_backup
          - rotate

# Triggered either manually or via auth-api's platform-admin "Infrastructure
# Monitor" panel (POST /api/v1/admin/infra/sealed-secrets/rotate, dispatched
# through the GitHub API — see internal/httpapi/handlers/sealed_secrets_handler.go
# in auth-service/auth-api). Never touches individual service secrets; only the
# sealed-secrets-controller's own master keypair in kube-system.
#
# "rotate" deliberately does NOT force an out-of-schedule key regeneration by
# hand-manipulating key Secret annotations — the bitnami controller's own
# --key-renew-period (default 30 days) is the supported rotation mechanism, and
# a restart is what makes it re-check whether a rotation is due. Old keys are
# always retained (never deleted here) so every existing *.sealedsecret.yaml
# stays decryptable regardless of how many rotations have happened since.

jobs:
  sealed-secrets-key-ops:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install DevOps tools (kubectl)
        uses: ./.github/actions/install-devops-tools
        with:
          install_trivy: 'false'

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config" 2>/dev/null || echo "$KUBE_CONFIG" > "$HOME/.kube/config"
          kubectl get nodes

      - name: Restart controller (rotate only)
        if: inputs.action == 'rotate'
        run: |
          echo "::group::Restarting sealed-secrets-controller"
          kubectl rollout restart deployment/sealed-secrets-controller -n kube-system
          kubectl rollout status deployment/sealed-secrets-controller -n kube-system --timeout=90s
          echo "Controller restarted — its own --key-renew-period logic decides whether a new key gets generated."
          echo "::endgroup::"

      - name: Refresh backup
        env:
          # The default GITHUB_TOKEN cannot manage repo secrets (no permission scope
          # for it) -- reuses the same canonical PAT sync-secrets.yml already uses
          # for its own `gh secret set` calls.
          GH_TOKEN: ${{ secrets.PROPAGATE_PAT || secrets.GH_PAT }}
        run: |
          echo "::group::Backing up the current sealed-secrets key(s) to the SEALED_SECRETS_MASTER_KEY secret"
          kubectl get secret -n kube-system -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml | \
            gh secret set SEALED_SECRETS_MASTER_KEY --repo "${{ github.repository }}"
          echo "✅ Backup refreshed"
          echo "::endgroup::"

      - name: Summary
        run: |
          echo "## Sealed Secrets: ${{ inputs.action }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.action }}" = "rotate" ]; then
            echo "- Controller restarted; a new key was generated only if the configured renew period had elapsed." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- \`SEALED_SECRETS_MASTER_KEY\` GitHub secret refreshed to match the current in-cluster key state." >> "$GITHUB_STEP_SUMMARY"
          echo "- Old keys are never deleted by this workflow — every existing sealed secret stays decryptable." >> "$GITHUB_STEP_SUMMARY"
