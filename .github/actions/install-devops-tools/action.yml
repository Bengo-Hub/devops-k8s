name: Install DevOps Tools

description: 'Reusable composite action to install all required DevOps tools'

inputs:
  install_trivy:
    description: 'Install Trivy security scanner'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Install kubectl
      shell: bash
      run: |
        # Check if kubectl is already installed
        if command -v kubectl &> /dev/null; then
          echo "✓ kubectl already installed"
          kubectl version --client=true
          exit 0
        fi

        # Install kubectl — every network call bounded so a slow/dead host
        # fails fast instead of hanging the job for hours (2026-08-18: this
        # exact step hung 20+ minutes with no timeout on multiple real
        # production deploys, root cause was here, not the calling repos).
        CURL_OPTS="--connect-timeout 10 --max-time 60 --retry 2 --retry-delay 3"
        VER=$(curl -L -s $CURL_OPTS https://dl.k8s.io/release/stable.txt)
        curl -LO $CURL_OPTS https://dl.k8s.io/release/${VER}/bin/linux/amd64/kubectl
        sudo install -m 0755 kubectl /usr/local/bin/kubectl
        kubectl version --client=true

    - name: Install Helm
      shell: bash
      run: |
        # Check if Helm is already installed (from cache or system)
        if command -v helm &> /dev/null; then
          echo "✓ Helm already installed"
          helm version
          exit 0
        fi

        # Try to install Helm — bounded both at the download (curl) and the
        # overall installer-script execution (timeout wrapper), so a hung
        # download or a hung install script can't block the job indefinitely.
        timeout 90 bash -c 'curl -fsSL --connect-timeout 10 --max-time 60 https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash' || {
          echo "⚠️ Network connectivity issue - cannot install Helm"
          echo "This is a transient GitHub Actions infrastructure issue"
          echo "Please retry the workflow in a few minutes"
          exit 1
        }
        helm version

    - name: Install yq
      shell: bash
      run: |
        # Check if yq is already installed
        if command -v yq &> /dev/null; then
          echo "✓ yq already installed"
          yq --version
          exit 0
        fi

        # Install yq
        sudo curl -L --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 3 "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq
        yq --version

    - name: Install Trivy (optional)
      shell: bash
      if: ${{ inputs.install_trivy == 'true' }}
      run: |
        # Check if Trivy is already installed
        if command -v trivy &> /dev/null; then
          echo "✓ Trivy already installed"
          trivy --version
          exit 0
        fi

        # Install Trivy — bounded the same way as the tools above. This apt-get/apt-key
        # chain was the one gap the 2026-08-18 timeout pass missed: apt-get has no timeout
        # of its own, so a slow/unreachable mirror (or the third-party Trivy repo) hangs
        # indefinitely, and with no TTY a stray debconf prompt can block forever too.
        # `sudo VAR=val cmd` (not a plain `export`) is required for DEBIAN_FRONTEND to
        # actually reach apt-get — sudo's default env_reset drops a bare exported var.
        timeout 90 sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
        timeout 90 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y wget apt-transport-https gnupg lsb-release
        timeout 30 wget --timeout=30 --tries=2 -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        timeout 90 sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
        timeout 120 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y trivy
        trivy --version

    - name: Install ArgoCD CLI
      shell: bash
      run: |
        # Check if ArgoCD CLI is already installed
        if command -v argocd &> /dev/null; then
          echo "✓ ArgoCD CLI already installed"
          argocd version --client || true
          exit 0
        fi

        # Install ArgoCD CLI
        ARGOCD_VERSION="v2.13.0"
        curl -sSL --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 3 -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64
        sudo install -m 0755 /tmp/argocd /usr/local/bin/argocd
        argocd version --client || true
        rm -f /tmp/argocd

    - name: Install system dependencies
      shell: bash
      run: |
        # Check which dependencies are missing
        MISSING_DEPS=()

        command -v jq &> /dev/null || MISSING_DEPS+=("jq")
        command -v curl &> /dev/null || MISSING_DEPS+=("curl")
        command -v git &> /dev/null || MISSING_DEPS+=("git")
        command -v openssl &> /dev/null || MISSING_DEPS+=("openssl")

        if [ ${#MISSING_DEPS[@]} -eq 0 ]; then
          echo "✓ All system dependencies already installed"
          exit 0
        fi

        # Install missing dependencies — same apt-get timeout bounding as Trivy above.
        echo "Installing missing dependencies: ${MISSING_DEPS[*]}"
        timeout 90 sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
        timeout 90 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${MISSING_DEPS[@]}"
