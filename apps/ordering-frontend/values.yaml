# Ordering Service Frontend Production Configuration
nameOverride: ordering-frontend
fullnameOverride: ordering-frontend
# ============================================================================
# IMAGE CONFIGURATION
# ============================================================================
image:
  repository: docker.io/codevertex/ordering-frontend
  tag: "1b8e3503"
  pullPolicy: Always
  pullSecrets:
    - name: registry-credentials
# ============================================================================
# REPLICA AND SCALING CONFIGURATION
# ============================================================================
# Baseline used only when autoscaling is disabled; HPA (below) governs live replicas.
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
# ============================================================================
# SERVICE CONFIGURATION
# ============================================================================
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
# ============================================================================
# DEPLOYMENT STRATEGY
# ============================================================================
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
minReadySeconds: 30
# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
# Load all environment variables from secret (like auth-ui)
envFromSecret: ordering-frontend-secrets
env:
  # API URLs - Production endpoints
  - name: NEXT_PUBLIC_API_URL
    value: https://orderingapi.codevertexafrica.com
  - name: NEXT_PUBLIC_NOTIFICATIONS_URL
    value: https://notificationsapi.codevertexafrica.com
  - name: NEXT_PUBLIC_SSO_URL
    value: https://sso.codevertexafrica.com
  - name: NEXT_PUBLIC_APP_URL
    value: https://ordering.codevertexafrica.com
  - name: NEXT_PUBLIC_SUBSCRIPTIONS_API_URL
    value: https://pricingapi.codevertexafrica.com
  # Server-side /api/features-catalog proxy runs inside the cluster — route it via
  # in-cluster Service DNS instead of looping back out through the public
  # domain/Cloudflare/ingress. Browser code keeps using the URL above.
  - name: SUBSCRIPTION_BASE_URL
    value: http://subscription-api.subscriptions.svc.cluster.local:4000
  - name: NEXT_PUBLIC_SUBSCRIPTIONS_UI_URL
    value: https://pricing.codevertexafrica.com
  # Map and logistics URLs
  - name: NEXT_PUBLIC_TILE_SERVER_URL
    value: https://tiles.codevertexafrica.com
  - name: NEXT_PUBLIC_LOGISTICS_API_URL
    value: https://logisticsapi.codevertexafrica.com/api/v1
  # Treasury (finance) API and UI URLs
  - name: NEXT_PUBLIC_TREASURY_API_URL
    value: https://booksapi.codevertexafrica.com
  - name: NEXT_PUBLIC_TREASURY_UI_URL
    value: https://books.codevertexafrica.com
  # Optional third-party integrations (from secret)
  - name: NEXT_PUBLIC_MAPBOX_TOKEN
    valueFrom:
      secretKeyRef:
        name: ordering-frontend-secrets
        key: mapboxToken
        optional: true
  - name: NEXT_PUBLIC_SENTRY_DSN
    valueFrom:
      secretKeyRef:
        name: ordering-frontend-secrets
        key: sentryDsn
        optional: true
# ============================================================================
# HEALTH CHECKS
# ============================================================================
# Health checks - using /healthz which returns 200 JSON (root / redirects → 3xx, probes fail)
healthCheck:
  enabled: true
  readiness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
# ============================================================================
# RESOURCE LIMITS AND REQUESTS
# ============================================================================
# Next.js SSR/RSC server: raised headroom so concurrent customers don't throttle
# a single 500m pod; HA via HPA (above).
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi
# ============================================================================
# INGRESS CONFIGURATION
# ============================================================================
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: ordering.codevertexafrica.com
      paths:
        - path: /
          pathType: Prefix
    # Fixed tenant domains (same pattern as truload-frontend's kuraweigh.kura.go.ke). New tenant
    # domains are connected from the SSO Domains screen instead: auth-api creates their Ingress
    # (td-* objects, manifests/auth-api-domains-rbac.yaml). The app's
    # src/proxy.ts maps each host to its tenant slug. Keep in step with HOSTNAME_SLUG_MAP in
    # ordering-frontend src/lib/tenant-domains.ts and auth-api TENANT_APP_HOSTS.
    # alpha-china-market
    - host: alphachinamarket.co.ke
      paths:
        - path: /
          pathType: Prefix
    - host: www.alphachinamarket.co.ke
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - ordering.codevertexafrica.com
      secretName: ordering-frontend-tls
    # Tenant domain TLS (cert-manager HTTP-01 issues once DNS points at the cluster)
    - hosts:
        - alphachinamarket.co.ke
        - www.alphachinamarket.co.ke
      secretName: alphachinamarket-storefront-tls
# ============================================================================
# MONITORING AND OBSERVABILITY
# ============================================================================
monitoring:
  enabled: false
serviceMonitor:
  enabled: false
# ============================================================================
# VPA CONFIGURATION - Recommendation-only mode
# ============================================================================
verticalPodAutoscaling:
  enabled: true
  updateMode: "Off"
  minCPU: 50m
  maxCPU: 1000m
  minMemory: 128Mi
  maxMemory: 2Gi
  controlledResources: ["cpu", "memory"]
  controlledValues: RequestsAndLimits
  recommendationMode: true
pdb:
  enabled: true
  minAvailable: 1
