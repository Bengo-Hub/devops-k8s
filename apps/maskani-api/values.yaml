# maskani-api: Maskani property management API (namespace maskani).
# Migrations and seed run in the image entrypoint (advisory lock 727271007, POSTGRES_MIGRATE_URL).
nameOverride: maskani-api
fullnameOverride: maskani-api
# HA baseline: 2 replicas (HPA 2 to 3) with a PDB. The migrate step takes advisory lock 727271007,
# so two pods starting together run migrations once. Never set 0: the local-path media PVC
# (WaitForFirstConsumer) then never binds and ArgoCD shows the app Progressing forever.
replicaCount: 2
image:
  repository: docker.io/codevertex/maskani-api
  tag: "65fd3408" # set by CI on first successful build
  pullPolicy: Always
  pullSecrets:
    - name: registry-credentials
service:
  type: ClusterIP
  port: 4000
  targetPort: 4000
migrations:
  enabled: false
seed:
  enabled: false
healthCheck:
  enabled: true
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
# The image's non-root "app" user is uid 100 / gid 101 (alpine adduser -S); the media PVC init
# container and fsGroup follow it so uploads stay writable across restarts.
securityContext:
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
env:
  - name: APP_ENV
    value: production
  - name: HTTP_PORT
    value: "4000"
  - name: HTTP_PUBLIC_BASE_URL
    value: "https://maskaniapi.codevertexafrica.com"
  - name: HTTP_ALLOWED_ORIGINS
    value: "https://maskaniapp.codevertexafrica.com,https://maskani.codevertexafrica.com,https://accounts.codevertexafrica.com,https://sso.codevertexafrica.com,http://localhost:3020,http://localhost:3021"
  - name: POSTGRES_URL
    valueFrom:
      secretKeyRef:
        name: maskani-api-secrets
        key: POSTGRES_URL
  - name: POSTGRES_MIGRATE_URL
    valueFrom:
      secretKeyRef:
        name: maskani-api-secrets
        key: POSTGRES_MIGRATE_URL
        optional: true
  - name: POSTGRES_MAX_OPEN_CONNS
    value: "8"
  - name: POSTGRES_MAX_IDLE_CONNS
    value: "4"
  - name: POSTGRES_CONN_MAX_LIFETIME
    value: "15m"
  - name: REDIS_ADDR
    value: redis-master.infra.svc.cluster.local:6379
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: maskani-api-secrets
        key: REDIS_PASSWORD
        optional: true
  - name: EVENTS_NATS_URL
    value: "nats://nats.messaging.svc.cluster.local:4222,nats://nats.codevertexafrica.com:4222"
  # Server-side auth calls go in-cluster; the issuer check uses the public SSO host.
  - name: AUTH_SERVICE_URL
    value: "http://auth-api.auth.svc.cluster.local:4000"
  - name: AUTH_API_URL
    value: "http://auth-api.auth.svc.cluster.local:4000"
  - name: AUTH_JWKS_URL
    value: "http://auth-api.auth.svc.cluster.local:4000/api/v1/.well-known/jwks.json"
  - name: AUTH_ISSUER
    value: "https://sso.codevertexafrica.com"
  - name: TREASURY_SERVICE_URL
    value: "http://treasury-api.treasury.svc.cluster.local:4000"
  - name: ERP_SERVICE_URL
    value: "http://erp-api.erp.svc.cluster.local:80"
  - name: NOTIFICATIONS_SERVICE_URL
    value: "http://notifications-api.notifications.svc.cluster.local:4000"
  - name: SUBSCRIPTION_BASE_URL
    value: "http://subscription-api.subscriptions.svc.cluster.local:4000"
  - name: OTLP_ENDPOINT
    value: http://otel-collector.infra.svc.cluster.local:4317
  - name: INTERNAL_SERVICE_KEY
    valueFrom:
      secretKeyRef:
        name: maskani-api-secrets
        key: INTERNAL_SERVICE_KEY
        optional: true
  - name: FIELD_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: maskani-api-secrets
        key: FIELD_ENCRYPTION_KEY
  - name: MEDIA_ROOT
    value: "/data/media"
  - name: MEDIA_URL_BASE
    value: "https://maskaniapi.codevertexafrica.com"
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
verticalPodAutoscaling:
  enabled: false
monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
persistence:
  enabled: true
  size: 5Gi
  mountPath: /data/media
  accessMode: ReadWriteOnce
  storageClass: local-path
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://maskaniapp.codevertexafrica.com, https://maskani.codevertexafrica.com, https://accounts.codevertexafrica.com, https://sso.codevertexafrica.com, http://localhost:3020, http://localhost:3021"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Accept, Authorization, Content-Type, X-Tenant-ID, X-Tenant-Slug, X-Request-ID, X-Outlet-ID, X-API-Key, X-Device-Key, Idempotency-Key"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "300"
  hosts:
    - host: maskaniapi.codevertexafrica.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - maskaniapi.codevertexafrica.com
      secretName: maskaniapi-tls
pdb:
  enabled: true
  minAvailable: 1
