# Notifications UI Production Configuration
nameOverride: notifications-ui
fullnameOverride: notifications-ui
# ============================================================================
# IMAGE CONFIGURATION
# ============================================================================
image:
  repository: docker.io/codevertex/notifications-ui
  tag: "bb3af669"
  pullPolicy: Always
  pullSecrets:
    - name: registry-credentials
# ============================================================================
# REPLICA AND SCALING CONFIGURATION
# ============================================================================
replicaCount: 2
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
serviceMonitor:
  enabled: false
# VPA Configuration (Vertical Pod Autoscaler)
verticalPodAutoscaling:
  enabled: false
  minCPU: 50m
  maxCPU: 750m
  minMemory: 128Mi
  maxMemory: 1Gi
  controlledResources: ["cpu", "memory"]
  controlledValues: RequestsAndLimits
# ============================================================================
# SERVICE CONFIGURATION
# ============================================================================
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
# ============================================================================
# DEPLOYMENT STRATEGY
# ============================================================================
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
minReadySeconds: 20
# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
envFromSecret: notifications-ui-secrets
env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3000"
  # Server-side /api/features-catalog proxy runs inside the cluster — route it via
  # in-cluster Service DNS instead of looping back out through the public
  # pricingapi.codevertexafrica.com domain/Cloudflare/ingress.
  - name: SUBSCRIPTION_BASE_URL
    value: http://subscription-api.subscriptions.svc.cluster.local:4000
  # Pre-existing gap found while live-verifying the above with a real login: notifications-ui
  # never had any INTERNAL_SERVICE_KEY at all (confirmed via a full secret dump), so
  # subscription-api's X-API-Key check was 401ing. Added the shared platform key to
  # notifications-ui-secrets (matches the identical value already used by pos-ui/treasury-ui/
  # logistics-ui/inventory-ui, confirmed via sha256 comparison before copying) and wired it here.
  - name: INTERNAL_SERVICE_KEY
    valueFrom:
      secretKeyRef:
        name: notifications-ui-secrets
        key: INTERNAL_SERVICE_KEY
        optional: false
  - name: NEXT_PUBLIC_API_URL
    valueFrom:
      secretKeyRef:
        name: notifications-ui-secrets
        key: NEXT_PUBLIC_API_URL
# ============================================================================
# RESOURCE LIMITS
# ============================================================================
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
# ============================================================================
# HEALTH CHECKS
# ============================================================================
healthCheck:
  enabled: true
  liveness:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 15
  readiness:
    httpGet:
      path: /
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
# ============================================================================
# INGRESS CONFIGURATION
# ============================================================================
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: notifications.codevertexafrica.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: notifications-ui-tls
      hosts:
        - notifications.codevertexafrica.com
pdb:
  enabled: true
  minAvailable: 1
