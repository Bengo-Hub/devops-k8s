apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.12.0
    helm:
      values: |
        # Live Deployment listens on 4443 (older chart default). Chart 3.12.0 defaults to
        # 10250, and both ports are named https, so the patch can never merge them
        # (Duplicate value: https). Pin to the live port instead of recreating it.
        containerPort: 4443
        # Runs hostNetwork on this port, so a surge pod can never schedule beside the old one
        # and a default rollout sits Pending forever (seen 2026-11-06). Replace in place; the
        # HPAs hold their last state for the few seconds of the swap.
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        # 2026-11-06: chart default 100m/200Mi, measured ~17m/48Mi. Serves all 25 HPAs,
        # so the request keeps a real margin above live use and no CPU limit is set.
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
        args:
          - --kubelet-insecure-tls
          - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # 2026-10-17: client-side apply failed every sync with 'ports[1].name: Duplicate
      # value: https' (chart moved the port), leaving the app OutOfSync. Server-side
      # apply merges ports by key and avoids the duplicate.
      - ServerSideApply=true


