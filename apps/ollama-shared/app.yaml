apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-shared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bengo-Hub/devops-k8s.git
    targetRevision: main
    path: apps/ollama-shared/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: shared-infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # 2026-10-17: app resynced every few seconds (dozens of "Initiated automated sync"
  # events), pointless write load on the single-node etcd. The server-side diff shows
  # two fields that can never converge: volumeClaimTemplates (immutable on a
  # StatefulSet, server-defaulted) and the pull-models init container cpu limit.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates
        - .spec.template.spec.initContainers[]?.resources.limits.cpu
