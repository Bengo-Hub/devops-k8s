nameOverride: email-provisioner
fullnameOverride: email-provisioner
replicaCount: 1
image:
  repository: docker.io/codevertex/email-provisioner
  tag: "a6dcb499"
  pullPolicy: Always
  pullSecrets:
    - name: registry-credentials
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
# email-provisioner owns no database — it is a deliberately dumb NATS-to-Stalwart
# bridge. See .claude/plans/codevertex-email-hosting-service-plan.md Part 3E.
migrations:
  enabled: false
seed:
  enabled: false
envFromSecret: email-provisioner-env
healthCheck:
  enabled: true
  startup:
    httpGet:
      path: /healthz/live
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  readiness:
    httpGet:
      path: /healthz/ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    httpGet:
      path: /healthz/live
      port: http
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
minReadySeconds: 10
progressDeadlineSeconds: 300
env:
  - name: PORT
    value: "8080"
  - name: EVENTS_NATS_URL
    value: "nats://nats.messaging.svc.cluster.local:4222,nats://nats.codevertexafrica.com:4222"
  - name: REDIS_ADDR
    value: redis-master.infra.svc.cluster.local:6379
  - name: STALWART_ADMIN_URL
    value: "http://stalwart-mail.email.svc.cluster.local:8080"
  - name: STALWART_ADMIN_USER
    # Fixed 2026-08-11: bare "admin" doesn't authenticate on the now-current
    # v0.16.x Stalwart (confirmed live: 401). The real wizard-created admin
    # account is a full email address, not a bare username - this was silently
    # broken since deploy, meaning every Stalwart API call this service ever
    # made would have failed auth even before the client.go rewrite fixed the
    # request shapes themselves.
    value: "admin@codevertexafrica.com"
  - name: STALWART_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: stalwart-mail
        key: admin-password
  - name: SUBSCRIPTION_BASE_URL
    value: "http://subscriptions-api.subscriptions.svc.cluster.local:4000"
  - name: INTERNAL_SERVICE_KEY
    valueFrom:
      secretKeyRef:
        name: email-provisioner-env
        key: INTERNAL_SERVICE_KEY
        optional: true
  - name: SECURITY_JWKS_URL
    value: "https://sso.codevertexafrica.com/api/v1/.well-known/jwks.json"
  # Credential-delivery (2026-08-18) — must exactly match mail-ui's own copy
  # of this same secret (apps/mail-ui/values.yaml), which verifies the HMAC
  # this service signs. Deliberately optional at the app level (config.go):
  # see that file's comment for why this must never be required:"true"
  # again — it crash-looped production once already the moment this env var
  # didn't exist yet.
  - name: PROVISIONING_TOKEN_SECRET
    valueFrom:
      secretKeyRef:
        name: mail-provisioning-shared
        key: PROVISIONING_TOKEN_SECRET
        optional: true
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
autoscaling:
  enabled: false
monitoring:
  enabled: false
serviceMonitor:
  enabled: false
# No public Ingress — this service has no external API surface, only an
# internal health-check endpoint and NATS consumption.
ingress:
  enabled: false
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
pdb:
  enabled: false
