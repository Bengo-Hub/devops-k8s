# maskani-ui: Maskani console, owner portal, gate tablet (namespace maskani).
nameOverride: maskani-ui
fullnameOverride: maskani-ui
replicaCount: 2
minReadySeconds: 20
image:
  repository: docker.io/codevertex/maskani-ui
  tag: "258fb37a" # latest CI image; CI bumps this on every build
  pullPolicy: Always
  pullSecrets:
    - name: registry-credentials
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
healthCheck:
  enabled: true
  readiness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
env:
  # Server-side routes only; NEXT_PUBLIC_* values are baked in at build time.
  - name: SUBSCRIPTION_BASE_URL
    value: "http://subscription-api.subscriptions.svc.cluster.local:4000"
  - name: INTERNAL_SERVICE_KEY
    valueFrom:
      secretKeyRef:
        name: maskani-ui-secrets
        key: INTERNAL_SERVICE_KEY
        optional: true
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: false
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: maskaniapp.codevertexafrica.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - maskaniapp.codevertexafrica.com
      secretName: maskaniapp-tls
monitoring:
  enabled: false
verticalPodAutoscaling:
  enabled: false
pdb:
  enabled: true
  minAvailable: 1
