apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kured
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubereboot.github.io/charts
    chart: kured
    targetRevision: 6.1.0
    helm:
      values: |
        # Node-reboot safety (2026-08-16 incident follow-up): converts an
        # already-pending kernel/OS update (reboot-required) into a
        # controlled cordon -> drain -> reboot -> uncordon sequence instead
        # of it sitting un-rebooted for weeks and eventually happening
        # uncontrolled. Does NOT protect against a hypervisor-forced
        # reboot (nothing can) — only against self-inflicted ones.
        configuration:
          period: 1h
          rebootSentinel: /var/run/reboot-required
          # 2026-08-19 incident: drainTimeout defaults to 0 (infinite), so when
          # redis-master's PDB permanently disallowed disruption, kured retried
          # the eviction in a tight loop non-stop for 3+ days (2500+ attempts),
          # and that retry volume was enough to push etcd past its apply-latency
          # budget, which made kube-scheduler and kube-controller-manager lose
          # their leader-election leases and restart-loop (RecentHighRestartCount
          # alert). Bounding drainTimeout keeps a real, permanently-unsatisfiable
          # PDB from ever hammering the control plane again, but the actual
          # unsatisfiable-PDB deadlock itself is fixed as of 2026-09-01 (redis-
          # master's PDB was removed — see manifests/databases/redis-statefulset.yaml)
          # after it caused a 3-night-running silent reboot-drain failure: kured
          # cordoned/evicted what it could every hour in its window, timed out on
          # redis-master every time, uncordoned, and retried next hour — churning
          # the whole fleet nightly while never actually applying the pending
          # security update. Keep this timeout as a general safety bound even
          # though nothing should permanently block drain anymore.
          drainTimeout: 5m
          # 00:00-02:00 UTC = 03:00-05:00 EAT, the platform's lowest-traffic
          # window. Single time zone chosen (not crossing midnight) to
          # avoid kured's start/end-time window semantics getting tricky.
          startTime: "00:00"
          endTime: "02:00"
          rebootDays:
            - su
            - mo
            - tu
            - we
            - th
            - fr
            - sa
          # Deliberately NOT overriding drain behavior: kured respects
          # PodDisruptionBudgets by default. As of 2026-09-01 no workload on
          # this cluster has a PDB that can never be satisfied by a voluntary
          # eviction (redis-master's was removed — the last one), so a normal
          # drain within drainTimeout should now complete and kured should
          # actually reboot the node during its next scheduled window instead
          # of stalling forever. If a future service adds a minAvailable:1 PDB
          # on a single replica with no failover, this will silently regress
          # to the same stuck-forever pattern — see ha-min-2-pods-and-pdb.md's
          # singleton exception list before adding a PDB to any 1-replica
          # workload.
      releaseName: kured
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
