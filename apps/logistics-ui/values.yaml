nameOverride: logistics-ui
fullnameOverride: logistics-ui
replicaCount: 2
minReadySeconds: 30
image:
  repository: docker.io/codevertex/logistics-ui
  tag: "8eeaee2c"
  pullPolicy: Always
  pullSecrets:
    - name: registry-credentials
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
healthCheck:
  enabled: true
  readiness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
env:
  - name: NEXT_PUBLIC_API_URL
    value: https://logisticsapi.codevertexafrica.com/api/v1
  - name: NEXT_PUBLIC_SSO_URL
    value: https://sso.codevertexafrica.com
  - name: NEXT_PUBLIC_NOTIFICATIONS_URL
    value: https://notifications.codevertexafrica.com
  - name: NEXT_PUBLIC_SUBSCRIPTIONS_API_URL
    value: https://pricingapi.codevertexafrica.com
  # Server-side /api/features-catalog proxy runs inside the cluster — route it via
  # in-cluster Service DNS instead of looping back out through the public
  # domain/Cloudflare/ingress. Browser code keeps using the URL above.
  - name: SUBSCRIPTION_BASE_URL
    value: http://subscription-api.subscriptions.svc.cluster.local:4000
  # Pre-existing gap found while live-verifying the above: logistics-ui-secrets already
  # has a real INTERNAL_SERVICE_KEY value, it was just never wired into this Deployment's
  # env — subscription-api's /api/v1/features/catalog requires it, unrelated to and
  # pre-dating this session's networking fix.
  - name: INTERNAL_SERVICE_KEY
    valueFrom:
      secretKeyRef:
        name: logistics-ui-secrets
        key: INTERNAL_SERVICE_KEY
        optional: false
  - name: NEXT_PUBLIC_SUBSCRIPTIONS_UI_URL
    value: https://pricing.codevertexafrica.com
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: logistics.codevertexafrica.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - logistics.codevertexafrica.com
      secretName: logistics-ui-tls
monitoring:
  enabled: false
serviceMonitor:
  enabled: false
verticalPodAutoscaling:
  enabled: true
  updateMode: "Off"
  minCPU: 50m
  maxCPU: 1000m
  minMemory: 128Mi
  maxMemory: 2Gi
  controlledResources: ["cpu", "memory"]
  controlledValues: RequestsAndLimits
  recommendationMode: true
pdb:
  enabled: true
  minAvailable: 1
