nameOverride: inventory-api
fullnameOverride: inventory-api
replicaCount: 1 # Optimized for resource-constrained environment
image:
  repository: docker.io/codevertex/inventory-api
  tag: "a37459b9"
  pullPolicy: Always
  pullSecrets:
    - name: registry-credentials
service:
  type: ClusterIP
  port: 4000
  targetPort: 4000
# ============================================================================
# MIGRATIONS AND SEEDING
# ============================================================================
# Inventory-api currently does not have database migrations
# Schema management will be added in future releases
migrations:
  enabled: false # Handled by entrypoint.sh (runs inventory-migrate on startup)
seed:
  enabled: false # Handled by entrypoint.sh (runs inventory-seed on startup)
healthCheck:
  enabled: true
  readiness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0 # terminate old pod (release NATS push-durable bindings) before new subscribes
    maxUnavailable: 1
# Pod security context: the inventory-api image ships a built-in non-root user
# "app" (uid 100 / gid 101). Pin runAsUser/runAsGroup to it so the init-media
# init container (which derives its UID from .Values.securityContext, defaulting
# to 1000) creates the /data/media subtree owned by the SAME user the app runs
# as — otherwise init scaffolds dirs as 1000:1000 that the app (100) cannot write.
# fsGroup makes the media PVC group-owned by 101 and group-writable, so every
# uploaded file (and the per-tenant media/images/<tenant-slug>/items/ tree) stays
# consistently readable/writable across pod restarts.
securityContext:
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
env:
  # Standardized Go backend env vars — no service prefix (config.go namespace = "")
  - name: APP_ENV
    value: production
  - name: HTTP_PORT
    value: "4000"
  - name: POSTGRES_URL
    valueFrom:
      secretKeyRef:
        name: inventory-api-secrets
        key: POSTGRES_URL
  # Direct PostgreSQL URL for migrate/seed (bypasses PgBouncer transaction mode)
  - name: POSTGRES_MIGRATE_URL
    valueFrom:
      secretKeyRef:
        name: inventory-api-secrets
        key: POSTGRES_MIGRATE_URL
        optional: true
  # Read-replica URL (pgbouncer's inventory_ro alias — see manifests/databases/pgbouncer.yaml) for
  # ListItems' heavy catalog fetch only (internal/modules/items/service.go rc()). optional: true
  # so this deploys safely before the secret key is populated — app.go falls back to the primary.
  - name: POSTGRES_READONLY_URL
    valueFrom:
      secretKeyRef:
        name: inventory-api-secrets
        key: POSTGRES_READONLY_URL
        optional: true
  # Database connection pool settings (prevent connection exhaustion)
  - name: POSTGRES_MAX_OPEN_CONNS
    value: "8"
  - name: POSTGRES_MAX_IDLE_CONNS
    value: "4"
  - name: POSTGRES_CONN_MAX_LIFETIME
    value: "15m"
  - name: REDIS_ADDR
    value: redis-master.infra.svc.cluster.local:6379
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: inventory-api-secrets
        key: REDIS_PASSWORD
        optional: true
  # NATS - standard key EVENTS_NATS_URL (Events.NATSURL in config)
  - name: EVENTS_NATS_URL
    value: "nats://nats.messaging.svc.cluster.local:4222,nats://nats.codevertexafrica.com:4222"
  # Media upload configuration
  - name: MEDIA_ROOT
    value: "/data/media"
  - name: MEDIA_URL_BASE
    value: "https://inventoryapi.codevertexafrica.com"
  - name: OTLP_ENDPOINT
    value: http://otel-collector.infra.svc.cluster.local:4317
  # Shared S2S key — validates inbound requests from other services (ordering, pos, etc.)
  - name: INTERNAL_SERVICE_KEY
    valueFrom:
      secretKeyRef:
        name: inventory-api-secrets
        key: INTERNAL_SERVICE_KEY
        optional: true
  - name: HTTP_ALLOWED_ORIGINS
    value: "https://inventory.codevertexafrica.com,https://inventoryapi.codevertexafrica.com,https://pos.codevertexafrica.com,https://ordering.codevertexafrica.com,https://accounts.codevertexafrica.com,https://sso.codevertexafrica.com,http://localhost:3000,http://localhost:3001,https://theurbanloftcafe.com"
resources:
  requests:
    # Lowered 100m→50m: the single k3s node sits at ~99% CPU requests, so with maxSurge=0 the
    # new pod could not schedule into the headroom and the rollout stalled (Pending). A 50m
    # request fits and is ample for this light Go API (limit stays 500m).
    cpu: 50m
    memory: 256Mi
  limits:
    # Raised for the transaction-heavy inventory API: 750m CPU burst + 768Mi headroom
    # (bulk stock ops, catalog sync, brands-by-sku lookups). Limits are not reserved, so
    # this only affects burst ceilings — node request-allocation is unchanged.
    cpu: 750m
    memory: 768Mi
autoscaling:
  enabled: true
  minReplicas: 2
  # Raised 2->4: allow scale-out under transaction load (node has ~2.7 core / ~12Gi
  # request headroom; each pod requests only 50m/256Mi). Matches pos-api.
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
# Recommendation-only (updateMode Off) — captures a VPA object that was already live in-cluster
# (applied out-of-band, undocumented in GitOps) into this repo so it's no longer drift. Min/max
# left at the chart's own defaults (100m/128Mi–2000m/4096Mi), which already match the live object
# exactly. Switching to an active update mode is a separate, later decision, not bundled here.
verticalPodAutoscaling:
  enabled: true
  updateMode: "Off"
  controlledValues: "RequestsAndLimits"
monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
serviceMonitor:
  enabled: false
  namespace: infra
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus
persistence:
  enabled: true
  size: 5Gi
  mountPath: /data/media
  accessMode: ReadWriteOnce
  storageClass: local-path
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # CORS: allow frontend origins (see shared-docs/devops-k8s-ingress-cors.md)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://inventory.codevertexafrica.com, https://pos.codevertexafrica.com, https://ordering.codevertexafrica.com, https://accounts.codevertexafrica.com, https://sso.codevertexafrica.com, http://localhost:3000, http://localhost:3001, https://theurbanloftcafe.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Accept, Authorization, Content-Type, X-Tenant-ID, X-Tenant-Slug, X-Request-ID, X-Outlet-ID, X-API-Key"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "300"
  hosts:
    - host: inventoryapi.codevertexafrica.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - inventoryapi.codevertexafrica.com
      secretName: inventoryapi-tls
pdb:
  enabled: true
  minAvailable: 1
