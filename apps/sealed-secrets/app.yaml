apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.19.1
    helm:
      # kubeseal defaults to --controller-namespace=kube-system
      # --controller-name=sealed-secrets-controller — matching those
      # here means every future `kubeseal` invocation needs no extra flags.
      values: |
        fullnameOverride: sealed-secrets-controller
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        # 2026-10-17: probes timed out (Client.Timeout exceeded) on node load spikes;
        # chart default timeoutSeconds is 1. Also raised the CPU limit above, 200m
        # throttled a controller that reconciles in bursts.
        livenessProbe:
          timeoutSeconds: 5
        readinessProbe:
          timeoutSeconds: 5
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
