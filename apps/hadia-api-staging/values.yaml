# hadia-api-staging: Hadia's staging and training stack (namespace hadia-staging), cloned from
# apps/hadia-api. Its own auth tenant (hadia-staging), its own database (hadia_staging), its own
# Redis index and its own NATS durables, so it never shares treasury or payment events with live
# (owner decision, 27 November 2026; hadia-api docs/devops.md "Environments").
# Image: the same docker.io/codevertex/hadia-api image as live; the deploy-staging CI job only bumps
# image.tag here after the live job has built and pushed it.
# Migrations run in the image entrypoint (advisory lock 727271008, per database).
nameOverride: hadia-api-staging
fullnameOverride: hadia-api-staging
startupDependencies:
  - name: postgresql
    tcp: postgresql.infra.svc.cluster.local:5432
  - name: pgbouncer
    tcp: pgbouncer.infra.svc.cluster.local:6432
  - name: nats
    tcp: nats.messaging.svc.cluster.local:4222
  - name: auth-api
    url: http://auth-api.auth.svc.cluster.local:4000/api/v1/.well-known/jwks.json
# One replica, no HPA and no PDB: staging is for testing and training, not for uptime.
replicaCount: 1
image:
  repository: docker.io/codevertex/hadia-api
  tag: "438f597f" # set by CI (deploy-staging); never edited by hand
  pullPolicy: Always
  pullSecrets:
    - name: registry-credentials
service:
  type: ClusterIP
  port: 4000
  targetPort: 4000
migrations:
  enabled: false
seed:
  enabled: false
healthCheck:
  enabled: true
  startup:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    failureThreshold: 36
  readiness:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 20
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
# Shared object storage: the object-storage Secret must exist in hadia-staging too (devops
# object-storage.yml for this namespace). Keys are hadia/<tenant>/..., so the staging tenant never
# overwrites a live object.
objectStorage:
  enabled: true
securityContext:
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
env:
  # Staging: the staging payout number route and the load-test key work here, never in production.
  - name: APP_ENV
    value: staging
  - name: HADIA_TENANT_SLUG
    value: hadia-staging
  - name: HTTP_PORT
    value: "4000"
  - name: HTTP_PUBLIC_BASE_URL
    value: "https://api.staging.hadiafrica.com"
  - name: HADIA_APP_URL
    value: "https://staging.hadiafrica.com"
  - name: HTTP_ALLOWED_ORIGINS
    value: "https://staging.hadiafrica.com"
  - name: POSTGRES_URL
    valueFrom:
      secretKeyRef:
        name: hadia-api-secrets
        key: POSTGRES_URL
  - name: POSTGRES_SYSTEM_URL
    valueFrom:
      secretKeyRef:
        name: hadia-api-secrets
        key: POSTGRES_SYSTEM_URL
  - name: POSTGRES_MIGRATE_URL
    valueFrom:
      secretKeyRef:
        name: hadia-api-secrets
        key: POSTGRES_MIGRATE_URL
  - name: POSTGRES_READONLY_URL
    valueFrom:
      secretKeyRef:
        name: hadia-api-secrets
        key: POSTGRES_READONLY_URL
        optional: true
  - name: POSTGRES_MAX_OPEN_CONNS
    value: "4"
  - name: POSTGRES_MAX_IDLE_CONNS
    value: "2"
  - name: POSTGRES_CONN_MAX_LIFETIME
    value: "15m"
  - name: REDIS_ADDR
    value: redis-master.infra.svc.cluster.local:6379
  # Live uses index 0 (the default). Rate limits, job leases and idempotency keys all start with
  # "hadia", so a shared index would let staging take live's job leases.
  - name: REDIS_DB
    value: "9"
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: hadia-api-secrets
        key: REDIS_PASSWORD
        optional: true
  - name: EVENTS_NATS_URL
    value: "nats://nats.messaging.svc.cluster.local:4222"
  # Outgoing events stay on live's stream "hadia" (subjects hadia.> and hadia_secret.>): JetStream
  # refuses a second stream over the same subjects, and notifications-api reads only those streams.
  # Each event carries its tenant id, and notifications-api builds links from the tenant's app_url,
  # so staging mail opens staging.
  - name: NATS_STREAM
    value: "hadia"
  - name: NATS_DELIVER_GROUP
    value: "hadia-staging-workers"
  # The isolation that matters: staging's own durables on the treasury and tenant streams
  # (hadia-staging-escrow, -premium, -premium-refunds, -tenant-purge). With live's names the two
  # stacks would share one queue group, and each would ack and drop the other tenant's events.
  - name: NATS_CONSUMER_PREFIX
    value: "hadia-staging"
  - name: AUTH_SERVICE_URL
    value: "http://auth-api.auth.svc.cluster.local:4000"
  - name: AUTH_API_URL
    value: "http://auth-api.auth.svc.cluster.local:4000"
  - name: AUTH_JWKS_URL
    value: "http://auth-api.auth.svc.cluster.local:4000/api/v1/.well-known/jwks.json"
  - name: AUTH_ISSUER
    value: "https://sso.codevertexafrica.com"
  - name: TREASURY_SERVICE_URL
    value: "http://treasury-api.treasury.svc.cluster.local:4000"
  - name: NOTIFICATIONS_SERVICE_URL
    value: "http://notifications-api.notifications.svc.cluster.local:4000"
  - name: SUBSCRIPTION_BASE_URL
    value: "http://subscription-api.subscriptions.svc.cluster.local:4000"
  - name: TICKETING_SERVICE_URL
    value: "http://ticketing-api.ticketing.svc.cluster.local:4009"
  - name: INTERNAL_SERVICE_KEY
    valueFrom:
      secretKeyRef:
        name: hadia-api-secrets
        key: INTERNAL_SERVICE_KEY
  # Copied from live's hadia-api-secrets, never generated: data copied from live stays readable.
  - name: FIELD_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: hadia-api-secrets
        key: FIELD_ENCRYPTION_KEY
  - name: LOADTEST_BYPASS_KEY
    valueFrom:
      secretKeyRef:
        name: hadia-api-secrets
        key: LOADTEST_BYPASS_KEY
        optional: true
  # The one M-Pesa number staging payouts may go to; add it to this namespace's Secret only.
  - name: HADIA_STAGING_PAYOUT_NUMBER
    valueFrom:
      secretKeyRef:
        name: hadia-api-secrets
        key: HADIA_STAGING_PAYOUT_NUMBER
        optional: true
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
autoscaling:
  enabled: false
verticalPodAutoscaling:
  enabled: false
monitoring:
  enabled: false
persistence:
  enabled: false
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://staging.hadiafrica.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    # Same header list as live (internal/http/router/router.go must stay in step with both).
    nginx.ingress.kubernetes.io/cors-allow-headers: "Accept, Authorization, Content-Type, X-Tenant-ID, X-Tenant-Slug, X-Request-ID, X-API-Key, X-Registry-Token, Idempotency-Key, X-Search-Phone, X-OTP-Challenge, X-Privacy-Token, X-Requested-With"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "300"
  hosts:
    - host: api.staging.hadiafrica.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - api.staging.hadiafrica.com
      secretName: hadia-staging-api-tls
pdb:
  enabled: false
