# hadia-ui: Hadia public site, guest registry pages, owner app and staff console (namespace hadia).
# One deployment for testing and live (user decision 2026-11-06, the truload pattern). Live on
# hadiafrica.com since 27 November 2026 (www redirects to the apex). The separate staging stack was
# scrapped on 28 November 2026; staging.hadiafrica.com now redirects to the apex. CI owns image.tag;
# never edit it by hand.
nameOverride: hadia-ui
fullnameOverride: hadia-ui
replicaCount: 2
minReadySeconds: 20
image:
  repository: docker.io/codevertex/hadia-ui
  tag: "7e55ec49" # replaced by CI on the first build
  pullPolicy: Always
  pullSecrets:
    - name: registry-credentials
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
healthCheck:
  enabled: true
  readiness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
env:
  # Server-side rendering reads hadia-api in-cluster, never through Cloudflare. hadia-ui calls no
  # other service from the server, so it needs no INTERNAL_SERVICE_KEY or SUBSCRIPTION_BASE_URL.
  - name: API_INTERNAL_URL
    value: "http://hadia-api.hadia.svc.cluster.local:4000"
# 2026-11-08 (owner go-ahead): every page renders per request (the CSP nonce), and two pods
# capped at half a core throttled under load: 20 concurrent visitors gave the home page a 2.2 s
# median and 5.6 s worst. One core per pod and an autoscaler like hadia-api's.
resources:
  requests:
    cpu: 100m
    memory: 160Mi
  limits:
    cpu: 1000m
    memory: 384Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # www.hadiafrica.com answers with a permanent redirect to the apex (needs www in the TLS hosts).
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
  hosts:
    - host: hadiafrica.com
      paths:
        - path: /
          pathType: Prefix
    # Retired staging host (owner, 28 November 2026): hadia-ui answers every request on it with a
    # permanent redirect to the same path on hadiafrica.com, so old links and QR codes still work.
    - host: staging.hadiafrica.com
      paths:
        - path: /
          pathType: Prefix
    # Static assets host (item 61): Cloudflare-cached copy of /_next/static only, used through
    # NEXT_PUBLIC_ASSET_PREFIX. /.well-known/acme-challenge reaches cert-manager's own solver.
    - host: static.hadiafrica.com
      paths:
        - path: /_next/static
          pathType: Prefix
  tls:
    - hosts:
        - hadiafrica.com
        - www.hadiafrica.com
      secretName: hadia-live-tls
    - hosts:
        - staging.hadiafrica.com
      secretName: hadia-staging-tls
    - hosts:
        - static.hadiafrica.com
      secretName: hadia-static-tls
monitoring:
  enabled: false
verticalPodAutoscaling:
  enabled: false
pdb:
  enabled: true
  minAvailable: 1
