# hadia-ui-staging: Hadia's staging and training site (namespace hadia-staging), cloned from
# apps/hadia-ui. Built by the deploy-staging CI job with the staging NEXT_PUBLIC_* values
# (site staging.hadiafrica.com, API api.staging.hadiafrica.com, tenant hadia-staging, assets
# static-staging.hadiafrica.com) and pushed as docker.io/codevertex/hadia-ui:<sha8>-staging.
# CI owns image.tag; never edit it by hand.
#
# Host handover: until the cutover patch (devops-k8s/.staging-cutover.patch) is applied, the live
# hadia-ui ingress in namespace hadia still claims staging.hadiafrica.com and
# static-staging.hadiafrica.com. ingress-nginx serves a duplicated host from the older ingress, so
# these two hosts keep reaching live until that patch lands (hadia-api docs/devops.md, cutover).
nameOverride: hadia-ui-staging
fullnameOverride: hadia-ui-staging
replicaCount: 1
minReadySeconds: 10
image:
  repository: docker.io/codevertex/hadia-ui
  tag: "76b735f5-staging" # replaced by CI (deploy-staging)
  pullPolicy: Always
  pullSecrets:
    - name: registry-credentials
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
healthCheck:
  enabled: true
  readiness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
env:
  # Server-side rendering reads the staging API in-cluster.
  - name: API_INTERNAL_URL
    value: "http://hadia-api-staging.hadia-staging.svc.cluster.local:4000"
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 320Mi
autoscaling:
  enabled: false
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: staging.hadiafrica.com
      paths:
        - path: /
          pathType: Prefix
    # Cloudflare-cached copy of /_next/static only (NEXT_PUBLIC_ASSET_PREFIX of the staging build).
    - host: static-staging.hadiafrica.com
      paths:
        - path: /_next/static
          pathType: Prefix
  tls:
    - hosts:
        - staging.hadiafrica.com
      secretName: hadia-staging-ui-tls
    - hosts:
        - static-staging.hadiafrica.com
      secretName: hadia-staging-static-tls
monitoring:
  enabled: false
verticalPodAutoscaling:
  enabled: false
pdb:
  enabled: false
