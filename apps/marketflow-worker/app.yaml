apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketflow-worker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bengo-Hub/devops-k8s.git
    targetRevision: main
    path: manifests
    directory:
      # The worker Deployment, plus Cloudflare's origin-pull CA for the marketflow ingresses.
      include: "{marketflow-worker-deployment.yaml,marketflow-cloudflare-origin-pull-ca.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: marketflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  # marketflow namespace already exists
      - ServerSideApply=true
