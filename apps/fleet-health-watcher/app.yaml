apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-health-watcher
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Bengo-Hub/devops-k8s.git
    targetRevision: main
    path: manifests/monitoring-lite
    directory:
      include: '{fleet-health-watcher-rbac.yaml,fleet-health-watcher-deployment.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
