---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: superset-secrets
  namespace: default
spec:
  encryptedData:
    ADMIN_EMAIL: 
    ADMIN_FIRSTNAME: 
    ADMIN_LASTNAME: 
    ADMIN_PASSWORD: 
    ADMIN_USERNAME: 
    DATABASE_DB: 
    DATABASE_HOST: 
    DATABASE_PASSWORD: 
    DATABASE_PORT: 
    DATABASE_USER: 
    REDIS_HOST: 
    REDIS_PASSWORD: 
    REDIS_PORT: 
    SECRET_KEY: 
    SUPERSET_DB_PASSWORD: 
  template:
    metadata:
      labels:
        app: superset
        managed-by: script
      name: superset-secrets
      namespace: default
    type: Opaque
