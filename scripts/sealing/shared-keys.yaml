# Shared values and every Secret that carries a copy (plain map, no values).
# scripts/sealing/reseal-shared-key.sh <KEY> reseals the key into every "secrets" entry in one
# commit; "restart" lists the workloads (namespace/kind/name) that read it and must be restarted
# afterwards. Values are read at container start only.
#
# Regenerate the lists after adding a service: every Secret that has the key, and every
# Deployment, StatefulSet or CronJob that mounts one of them (envFrom, secretKeyRef or volume).
# Last generated from the cluster on 2026-11-18.
#
# DATABASE_PASSWORD and REDIS_PASSWORD are also embedded in each service's URL keys
# (POSTGRES_URL, POSTGRES_MIGRATE_URL, POSTGRES_READONLY_URL, REDIS_URL, DATABASE_URL). After a
# password change, rerun create-service-secrets.sh per service so it reseals those URLs too.

