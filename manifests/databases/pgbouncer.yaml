---
# PgBouncer — shared transaction pooler in front of postgresql.
# Apps update POSTGRES_URL host to pgbouncer.infra.svc.cluster.local:6432.
# Uses auth_query so each service's own postgres user (erp_user,
# inventory_user, ...) is authenticated dynamically — no per-user entry
# in userlist.txt needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: infra
data:
  pgbouncer.ini: |
    [databases]
    ; auth_dbname forces pgbouncer to run auth_query against 'postgres'
    ; db (where pgbouncer schema lives), regardless of which db the
    ; client is trying to reach.
    ; Per-database pool_size overrides for heavy-traffic services.
    ; Keeps them from starving lighter services and prevents connection exhaustion.
    ; CONNECTION BUDGET: keep sum(pool_size) + reserve_pool_size well under PostgreSQL
    ; max_connections (now 300) less ~5 superuser-reserved. max_db_connections (below) is a
    ; hard per-db backstop so no single db can exhaust the server.
    ; truload reduced 40->15: Hangfire now uses a DIRECT (non-pgbouncer) connection, so the
    ; pgbouncer pool no longer carries recurring-job load.
    truload = host=postgresql.infra.svc.cluster.local port=5432 dbname=truload auth_dbname=postgres pool_size=15
    kuraweigh = host=postgresql.infra.svc.cluster.local port=5432 dbname=kuraweigh auth_dbname=postgres pool_size=15
    ordering = host=postgresql.infra.svc.cluster.local port=5432 dbname=ordering auth_dbname=postgres pool_size=20
    bengo_erp = host=postgresql.infra.svc.cluster.local port=5432 dbname=bengo_erp auth_dbname=postgres pool_size=25
    auth = host=postgresql.infra.svc.cluster.local port=5432 dbname=auth auth_dbname=postgres pool_size=18
    logistics = host=postgresql.infra.svc.cluster.local port=5432 dbname=logistics auth_dbname=postgres pool_size=15
    notifications = host=postgresql.infra.svc.cluster.local port=5432 dbname=notifications auth_dbname=postgres pool_size=10
    treasury = host=postgresql.infra.svc.cluster.local port=5432 dbname=treasury auth_dbname=postgres pool_size=12
    subscriptions = host=postgresql.infra.svc.cluster.local port=5432 dbname=subscriptions auth_dbname=postgres pool_size=10
    inventory = host=postgresql.infra.svc.cluster.local port=5432 dbname=inventory auth_dbname=postgres pool_size=10
    marketflow = host=postgresql.infra.svc.cluster.local port=5432 dbname=marketflow auth_dbname=postgres pool_size=10
    pos = host=postgresql.infra.svc.cluster.local port=5432 dbname=pos auth_dbname=postgres pool_size=12
    ; Read-replica aliases (2026-08-20): route to postgresql-replica instead of the primary, for
    ; the specific heavy read-only endpoints wired via POSTGRES_READONLY_URL in inventory-api/
    ; pos-api (ListItems catalog fetch; All-Sales list/export). Same physical dbname on the
    ; replica (streaming copy of the primary), just a different upstream host. auth_dbname=postgres
    ; resolves against the REPLICA's own postgres db (auth_dbname inherits each entry's own host=)
    ; — fine, a physical streaming replica mirrors the whole cluster incl. the pgbouncer schema/
    ; user_lookup() function, and auth_query is a read-only SELECT. Deliberately small pool_size:
    ; this is a single-node cluster, the replica shares the same physical disk as the primary (see
    ; postgresql-replica-statefulset.yaml's own comment) — keep replica load light relative to the
    ; primary's.
    ; 2026-08-21: briefly raised to 8 to relieve boi-enterprises' catalog-sweep queuing, then
    ; reverted back to 4 the same day — live evidence right after the bump showed this replica's
    ; OWN checkpoint I/O had degraded to ~257s to write 1.5% of buffers (postgresql-replica-0 logs,
    ; restartpoint at 08:13:32Z), i.e. the real ceiling here is disk throughput, not connection
    ; count (CPU/mem were both <30%, kubectl top). More concurrent connections onto an
    ; already I/O-saturated disk just adds contention, not throughput — see the 2026-08-20
    ; apiserver-probe-hardening incident on this same shared disk. The actual fix is reducing
    ; QUERY VOLUME (done: inventory-api's OutletScope + Count() caching, same day), not pool size.
    inventory_ro = host=postgresql-replica.infra.svc.cluster.local port=5432 dbname=inventory auth_dbname=postgres pool_size=4
    pos_ro = host=postgresql-replica.infra.svc.cluster.local port=5432 dbname=pos auth_dbname=postgres pool_size=4
    isp_billing = host=postgresql.infra.svc.cluster.local port=5432 dbname=isp_billing auth_dbname=postgres pool_size=10
    projects = host=postgresql.infra.svc.cluster.local port=5432 dbname=projects auth_dbname=postgres pool_size=8
    ticketing = host=postgresql.infra.svc.cluster.local port=5432 dbname=ticketing auth_dbname=postgres pool_size=8
    codevertex = host=postgresql.infra.svc.cluster.local port=5432 dbname=codevertex auth_dbname=postgres pool_size=8
    superset = host=postgresql.infra.svc.cluster.local port=5432 dbname=superset auth_dbname=postgres pool_size=10
    * = host=postgresql.infra.svc.cluster.local port=5432 auth_dbname=postgres

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    unix_socket_dir =

    # Authentication: pgbouncer_auth role looks up SCRAM hashes via a
    # SECURITY DEFINER function in the pgbouncer schema. This means every
    # service user (erp_user, auth_user, ...) authenticates without
    # needing an entry in userlist.txt.
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    auth_user = pgbouncer_auth
    auth_query = SELECT uname, phash FROM pgbouncer.user_lookup($1)

    # Transaction-mode pooling. PgBouncer 1.21+ supports server-side
    # prepared statements in transaction mode via max_prepared_statements.
    # TUNED: Increased pool sizes to prevent exhaustion under Hangfire recurring job load.
    pool_mode = transaction
    max_client_conn = 5000
    default_pool_size = 15
    reserve_pool_size = 15
    reserve_pool_timeout = 2
    # Hard per-database backstop: no single db can open more than this many server
    # connections regardless of pool_size, so a runaway service can't exhaust
    # PostgreSQL's max_connections and starve other tenants.
    max_db_connections = 30
    server_idle_timeout = 300
    server_lifetime = 1800
    max_prepared_statements = 100

    # Fast failure on DB outage — prevents services hanging for minutes.
    # server_login_retry: how long to cache failed login before retrying (default 15s).
    # Reduced to 3s so services recover quickly after PostgreSQL restarts.
    server_login_retry = 3
    # query_wait_timeout: max time a query waits for a pool connection (default 120s).
    # Increased from 30s to 60s to allow Hangfire jobs time to acquire connections.
    query_wait_timeout = 60
    # server_connect_timeout: max time to wait for a new server connection.
    server_connect_timeout = 10
    # client_idle_timeout: disconnect idle client connections to free pool slots.
    # Increased from 120s to 300s to reduce false disconnects on long-running Hangfire jobs.
    client_idle_timeout = 300

    log_connections = 0
    log_disconnections = 0
    ignore_startup_parameters = extra_float_digits,search_path,options
    admin_users = admin_user,pgbouncer_auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: infra
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pgbouncer
      annotations:
        checksum/config: "v5-inventory-ro-pool-4-revert"
    spec:
      priorityClassName: db-critical
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.1-p0
          imagePullPolicy: IfNotPresent
          # Bypass edoburu's entrypoint (it rewrites pgbouncer.ini from env).
          # Run pgbouncer directly with our mounted ConfigMap.
          command: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
          ports:
            - name: pgbouncer
              containerPort: 6432
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
            - name: userlist
              mountPath: /etc/pgbouncer/userlist.txt
              subPath: userlist.txt
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
        - name: userlist
          secret:
            secretName: pgbouncer-auth-creds
            items:
              - key: userlist.txt
                path: userlist.txt
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: infra
  labels:
    app: pgbouncer
spec:
  type: ClusterIP
  selector:
    app: pgbouncer
  ports:
    - name: pgbouncer
      port: 6432
      targetPort: 6432
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer
  namespace: infra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pgbouncer
