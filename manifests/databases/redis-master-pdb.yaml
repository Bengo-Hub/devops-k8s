# redis-master is a single-replica StatefulSet. This PDB deliberately blocks
# voluntary eviction (drain/cordon) of the only pod rather than letting it be
# silently evicted with no standby ready to take over — see the 2026-08-16
# AOF-corruption incident. Anyone draining mss-prod-master needs to promote
# redis-replica or explicitly delete this PDB first.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-master
  namespace: infra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: redis
      component: master
