apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: infra
  labels:
    app: redis
    component: master
spec:
  type: ClusterIP
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app: redis
    component: master
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: infra
  labels:
    app: redis
    component: master
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app: redis
    component: master
---
apiVersion: v1
kind: Service
metadata:
  name: redis-metrics
  namespace: infra
  labels:
    app: redis
    component: metrics
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 9121
      targetPort: http-metrics
      protocol: TCP
  selector:
    app: redis
    component: master
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-configuration
  namespace: infra
data:
  redis.conf: |
    # Redis Configuration
    bind 0.0.0.0
    protected-mode no
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    
    # Memory management - increased for 12-core server with 47GB RAM
    maxmemory 3gb
    maxmemory-policy allkeys-lru
    
    # Persistence (RDB + AOF)
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    
    # AOF persistence
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # Logging
    loglevel notice
    logfile ""
    
    # Slow log
    slowlog-log-slower-than 10000
    slowlog-max-len 128
    
    # Security
    # Password will be set via REDIS_PASSWORD env var
---
# No PodDisruptionBudget on this singleton (2026-09-01, incident follow-up):
# a minAvailable:1 PDB on a 1-replica StatefulSet can never be satisfied by a
# voluntary eviction, so it permanently blocked kured's nightly drain (see
# apps/kured/app.yaml). The corruption risk that PDB was guarding against
# (2026-08-16 incident) is handled by terminationGracePeriodSeconds:60 +
# preStop SHUTDOWN SAVE below, not by blocking eviction outright — this is a
# cache (maxmemory-policy allkeys-lru) with AOF+RDB persistence, so a graceful
# restart is an acceptable, low-stakes blip, not a data-loss event. Matches
# the platform's own singleton convention in ha-min-2-pods-and-pdb.md
# (valhalla/tileserver/projects-ui). Do not re-add a PDB here without also
# giving redis-master real failover (Sentinel or similar).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: infra
  labels:
    app: redis
    component: master
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app: redis
      component: master
  template:
    metadata:
      labels:
        app: redis
        component: master
    spec:
      priorityClassName: db-critical
      # 60s (default is 30s) so a k8s-initiated termination (drain, node
      # cordon, rollout) gives preStop's SHUTDOWN SAVE time to flush the AOF
      # cleanly before SIGKILL — see the 2026-08-16 AOF-corruption incident.
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          # Start Redis with password if provided
          if [ -n "$REDIS_PASSWORD" ]; then
            redis-server /etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"
          else
            redis-server /etc/redis/redis.conf
          fi
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis
              key: redis-password
        resources:
          requests:
            cpu: 200m  # Increased - priority cache service
            memory: 1Gi  # Increased for better caching capacity
          limits:
            cpu: 1000m  # Can burst to 1 core
            memory: 4Gi  # Ample RAM for Redis operations
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              if [ -n "$REDIS_PASSWORD" ]; then
                redis-cli -a "$REDIS_PASSWORD" ping
              else
                redis-cli ping
              fi
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              if [ -n "$REDIS_PASSWORD" ]; then
                redis-cli -a "$REDIS_PASSWORD" ping
              else
                redis-cli ping
              fi
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 5
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - |
                if [ -n "$REDIS_PASSWORD" ]; then
                  redis-cli -a "$REDIS_PASSWORD" SHUTDOWN SAVE
                else
                  redis-cli SHUTDOWN SAVE
                fi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/redis
        securityContext:
          runAsUser: 999
          runAsNonRoot: true

      - name: metrics
        image: oliver006/redis_exporter:v1.62.0-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-metrics
          containerPort: 9121
          protocol: TCP
        env:
        - name: REDIS_ADDR
          value: "redis://localhost:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis
              key: redis-password
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
        # No liveness/readiness probes on the metrics sidecar. A probe that
        # scrapes /metrics (CPU-throttled at this limit) was timing out under
        # load: liveness killed the exporter (618 restarts, fatal exit 1), and
        # the readiness probe gated the whole redis-master pod -> the redis
        # Service dropped its endpoint and apps intermittently lost their cache
        # connection. The redis container's own redis-cli ping probes already
        # gate pod health correctly; the exporter must not.
      
      volumes:
      - name: config
        configMap:
          name: redis-configuration
  
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app: redis
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 8Gi

