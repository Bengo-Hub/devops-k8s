# Redis replica — purely additive, never touches redis-master's manifest or PVC.
# Single-node cluster: protects against a redis-master pod crash/OOM, not
# node/disk failure (same disk). No Sentinel/automatic failover — that needs
# >=3 independent processes to mean anything, and running all 3 on this one
# node would only protect against pod crashes k8s already self-heals, not
# the node failure that's the actual risk. Manual promotion only: see
# shared-docs/internal/operations/database-maintenance.md.
# Reuses the existing `redis` Secret's password — same AUTH password fleet-wide,
# no new credential needed (unlike the Postgres replica's dedicated role).
apiVersion: v1
kind: Service
metadata:
  name: redis-replica
  namespace: infra
  labels:
    app: redis
    component: replica
spec:
  type: ClusterIP
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app: redis
    component: replica
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-replica
  namespace: infra
  labels:
    app: redis
    component: replica
spec:
  serviceName: redis-replica
  replicas: 1
  selector:
    matchLabels:
      app: redis
      component: replica
  template:
    metadata:
      labels:
        app: redis
        component: replica
    spec:
      priorityClassName: db-critical
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          redis-server /etc/redis/redis.conf \
            --requirepass "$REDIS_PASSWORD" \
            --masterauth "$REDIS_PASSWORD" \
            --replicaof redis-master.infra.svc.cluster.local 6379 \
            --replica-read-only yes
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis
              key: redis-password
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 5
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/redis
        securityContext:
          runAsUser: 999
          runAsNonRoot: true
      volumes:
      - name: config
        configMap:
          name: redis-configuration
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app: redis
        component: replica
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 8Gi
