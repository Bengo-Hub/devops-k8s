# Read-only cluster access for the fleet-health-watcher CronJob (see
# fleet-health-watcher-cronjob.yaml). Grants GET/LIST only, cluster-wide,
# on pods — the one resource the watcher actually inspects (restart counts /
# waiting reasons). No write verbs anywhere, and deliberately narrower than
# auth-api-monitor's RBAC (manifests/auth-api-monitor-rbac.yaml) since this
# job doesn't need nodes/PVCs/ingresses/cronjobs — just pod health.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-health-watcher
  namespace: infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleet-health-watcher
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleet-health-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleet-health-watcher
subjects:
- kind: ServiceAccount
  name: fleet-health-watcher
  namespace: infra
---
# Namespaced (not cluster-wide) write access, and only for one named ConfigMap: the
# alert-dedup state the CronJob reads/writes each run so it doesn't re-send the same
# Slack/email alert every 2 minutes for the duration of an ongoing incident (see
# fleet-health-watcher-cronjob.yaml's STATE_CM block). "create" can't be scoped by
# resourceName in RBAC (the object doesn't exist yet) — get/update/patch/delete are.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-health-watcher-state
  namespace: infra
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["fleet-health-watcher-state"]
  verbs: ["get", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-health-watcher-state
  namespace: infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-health-watcher-state
subjects:
- kind: ServiceAccount
  name: fleet-health-watcher
  namespace: infra
