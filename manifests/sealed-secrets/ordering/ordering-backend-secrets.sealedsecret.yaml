---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: ordering-backend-secrets
  namespace: ordering
spec:
  encryptedData:
    AUTH_SERVICE_API_KEY: 
    DATABASE_HOST: 
    DATABASE_NAME: 
    DATABASE_PASSWORD: 
    DATABASE_PORT: 
    DATABASE_USER: 
    GOOGLE_TOKEN_ENCRYPTION_KEY: 
    INTERNAL_SERVICE_KEY: 
    INVENTORY_API_KEY: 
    LOGISTICS_API_KEY: 
    NOTIFICATIONS_API_KEY: 
    POSTGRES_MIGRATE_URL: 
    POSTGRES_URL: 
    REDIS_HOST: 
    REDIS_PASSWORD: 
    REDIS_PORT: 
    REDIS_URL: 
    SECRET_KEY: 
    TREASURY_API_KEY: 
  template:
    metadata:
      labels:
        app: ordering-backend
        managed-by: script
      name: ordering-backend-secrets
      namespace: ordering
    type: Opaque
