---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: auth-api-secrets
  namespace: auth
spec:
  encryptedData:
    DATABASE_HOST: 
    DATABASE_NAME: 
    DATABASE_PASSWORD: 
    DATABASE_PORT: 
    DATABASE_USER: 
    DEFAULT_TENANT_SLUG: 
    GIT_APP_ID: 
    GIT_APP_SECRET: 
    GOOGLE_CLIENT_ID: 
    GOOGLE_CLIENT_SECRET: 
    INTERNAL_SERVICE_KEY: 
    MICROSOFT_CLIENT_ID: 
    MICROSOFT_CLIENT_SECRET: 
    MICROSOFT_TENANT_ID: 
    OAUTH_STATE_SECRET: 
    POSTGRES_MIGRATE_URL: 
    POSTGRES_URL: 
    REDIS_HOST: 
    REDIS_PASSWORD: 
    REDIS_PORT: 
    REDIS_URL: 
    SECRET_KEY: 
    SEED_ADMIN_EMAIL: 
    SEED_ADMIN_PASSWORD: 
  template:
    metadata:
      labels:
        app: auth-api
        managed-by: script
      name: auth-api-secrets
      namespace: auth
    type: Opaque
