---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pos-api-secrets
  namespace: pos
spec:
  encryptedData:
    DATABASE_HOST: 
    DATABASE_NAME: 
    DATABASE_PASSWORD: 
    DATABASE_PORT: 
    DATABASE_USER: 
    INTERNAL_SERVICE_KEY: 
    POSTGRES_MIGRATE_URL: 
    POSTGRES_READONLY_URL: 
    POSTGRES_URL: 
    REDIS_HOST: 
    REDIS_PASSWORD: 
    REDIS_PORT: 
    REDIS_URL: 
    SECRET_KEY: 
  template:
    metadata:
      labels:
        app: pos-api
        managed-by: script
      name: pos-api-secrets
      namespace: pos
    type: Opaque
