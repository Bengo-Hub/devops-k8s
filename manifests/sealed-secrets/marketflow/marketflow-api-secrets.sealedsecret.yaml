---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: marketflow-api-secrets
  namespace: marketflow
spec:
  encryptedData:
    DATABASE_HOST: 
    DATABASE_NAME: 
    DATABASE_PASSWORD: 
    DATABASE_PORT: 
    DATABASE_USER: 
    ENCRYPTION_KEY: 
    INTERNAL_SERVICE_KEY: 
    META_VERIFY_TOKEN: 
    POSTGRES_MIGRATE_URL: 
    POSTGRES_URL: 
    REDIS_HOST: 
    REDIS_PASSWORD: 
    REDIS_PORT: 
    REDIS_URL: 
    SECRET_KEY: 
  template:
    metadata:
      labels:
        app: marketflow-api
        managed-by: script
      name: marketflow-api-secrets
      namespace: marketflow
    type: Opaque
