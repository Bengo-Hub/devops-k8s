---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: library-api-secrets
  namespace: library
spec:
  encryptedData:
    DATABASE_HOST: 
    DATABASE_NAME: 
    DATABASE_PASSWORD: 
    DATABASE_PORT: 
    DATABASE_USER: 
    INTERNAL_SERVICE_KEY: 
    POSTGRES_URL: 
    REDIS_HOST: 
    REDIS_PASSWORD: 
    REDIS_PORT: 
    REDIS_URL: 
    SECRET_KEY: 
    TERMINAL_JWT_SECRET: 
  template:
    metadata:
      labels:
        app: library-api
        managed-by: script
      name: library-api-secrets
      namespace: library
    type: Opaque
