---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: treasury-api-secrets
  namespace: treasury
spec:
  encryptedData:
    DATABASE_HOST: 
    DATABASE_NAME: 
    DATABASE_PASSWORD: 
    DATABASE_PORT: 
    DATABASE_USER: 
    INTERNAL_SERVICE_KEY: 
    POSTGRES_MIGRATE_URL: 
    POSTGRES_URL: 
    REDIS_HOST: 
    REDIS_PASSWORD: 
    REDIS_PORT: 
    REDIS_URL: 
    SECRET_KEY: 
    TREASURY_GATEWAY_ENCRYPTION_KEY: 
  template:
    metadata:
      labels:
        app: treasury-api
        managed-by: script
      name: treasury-api-secrets
      namespace: treasury
    type: Opaque
