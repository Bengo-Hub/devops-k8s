---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: codevertex-website-secrets
  namespace: codevertex
spec:
  encryptedData:
    DATABASE_HOST: 
    DATABASE_NAME: 
    DATABASE_PASSWORD: 
    DATABASE_PORT: 
    DATABASE_URL: 
    DATABASE_USER: 
    DIRECT_DATABASE_URL: 
    INTERNAL_SERVICE_KEY: 
    POSTGRES_MIGRATE_URL: 
    POSTGRES_URL: 
    REDIS_HOST: 
    REDIS_PASSWORD: 
    REDIS_PORT: 
    REDIS_URL: 
    SECRET_KEY: 
    SESSION_SECRET: 
  template:
    metadata:
      labels:
        app: codevertex-website
        managed-by: script
      name: codevertex-website-secrets
      namespace: codevertex
    type: Opaque
