    DATABASE_USER: 
    INTERNAL_SERVICE_KEY: 
    NOTIFICATIONS_DEFAULT_EMAIL_SENDER: 
    NOTIFICATIONS_NATS_URL: 
    POSTGRES_MIGRATE_URL: 
    POSTGRES_URL: 
    REDIS_HOST: 
    REDIS_PASSWORD: 
    REDIS_PORT: 
    REDIS_URL: 
    SECRET_KEY: 
    SECURITY_API_KEY_DB_URL: 
    SECURITY_ENCRYPTION_KEY: 
  template:
