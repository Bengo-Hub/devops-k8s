# Pod Security Standards, observe-only — see pos-namespace.yaml's header comment for the full
# reasoning (same pattern, applied per namespace). erp-api's values.yaml sets a numeric runAsUser
# (100) + runAsNonRoot:true; no privileged containers/host namespaces found.
apiVersion: v1
kind: Namespace
metadata:
  name: erp
  labels:
    kubernetes.io/metadata.name: erp
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
