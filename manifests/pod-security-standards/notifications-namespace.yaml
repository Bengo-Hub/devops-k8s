# Pod Security Standards, observe-only — see pos-namespace.yaml's header comment for the full
# reasoning (same pattern, applied per namespace). notifications-api's values.yaml sets a numeric
# runAsUser + runAsNonRoot:true; no privileged containers/host namespaces found.
apiVersion: v1
kind: Namespace
metadata:
  name: notifications
  labels:
    kubernetes.io/metadata.name: notifications
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
