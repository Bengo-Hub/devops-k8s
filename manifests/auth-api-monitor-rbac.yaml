# Read-only cluster access for auth-api's platform infrastructure monitoring
# dashboard (replaces the removed Prometheus/Grafana stack). Grants GET/LIST/WATCH
# only, cluster-wide, across exactly the resources the dashboard surfaces:
# node capacity/usage, top pods, namespaces, PVCs, ingresses, and cronjob/job
# health. No write verbs anywhere — this identity cannot create, delete, or
# modify anything in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-api-monitor
  namespace: auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auth-api-monitor
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes/proxy"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["cronjobs", "jobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: auth-api-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: auth-api-monitor
subjects:
- kind: ServiceAccount
  name: auth-api-monitor
  namespace: auth
