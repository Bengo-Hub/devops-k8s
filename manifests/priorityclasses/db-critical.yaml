---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: db-critical
value: 1000000000
globalDefault: false
description: "Highest priority for stateful data services (PostgreSQL, Redis, PgBouncer)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ingress-critical
value: 900000000
globalDefault: false
description: "High priority for cluster ingress + coredns — must not be evicted under pressure."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: auth-critical
value: 700000000
globalDefault: false
description: "auth-api — almost every other service fetches its JWKS at startup, so it must win scheduling/CPU over ordinary app workloads whenever the whole node is under pressure (e.g. a full reboot recovery)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-high
value: 500000000
globalDefault: false
description: "Platform services (argocd, prometheus, cert-manager) — above app workloads."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: batch-low
value: -100
globalDefault: false
preemptionPolicy: Never
description: "Background workers (marketflow-worker): below every app workload (default 0), so under pressure they wait or are evicted first, and they never preempt anything."
