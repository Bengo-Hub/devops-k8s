# Weekly vector tile refresh for tiles.codevertexafrica.com (rewritten 2026-11-07).
#
# The previous version of this file was never deployed and could not have worked: it
# wrote a .tmp output (planetiler picks the format from the extension and rejects it),
# used a jar path the image does not have, targeted an unused PVC, and never restarted
# the tileserver. Plain --download also only fetches MISSING sources, so the cached
# April extract would have been reused forever. Live tiles were built from OSM data of
# 2026-04-02 until this job ran.
#
# Flow, all steps tested against prod data on 2026-11-07:
#   1. probe (init): water polygons host reachable? (planetiler image has no curl)
#   2. build (init): refresh changed sources in place (ETag check, so an unchanged
#      upstream costs a HEAD request, not a download), build kenya.new.mbtiles in a
#      scratch dir. Water polygons are refreshed only when their host answers; their
#      cached copy is used otherwise (osmdata.openstreetmap.de was unreachable on
#      2026-11-07 and that must not fail the whole refresh).
#   3. publish (main): validate the new file; if its OSM replication sequence is not
#      newer than the one the tileserver serves, discard it (no restart, no outage);
#      else swap it in, restart the tileserver, and verify the SERVED sequence is the
#      new one and a Nairobi tile loads. On any failure the previous file is restored
#      and the tileserver restarted, and the Job fails. On success the previous file
#      and the scratch dir are deleted, so no old version is left behind.
#
# Sunday 20:15 UTC = 23:15 EAT, after the valhalla refresh starts (20:00) and before the
# PostgreSQL backup (20:30). The tileserver uses Recreate, so a swap means a few seconds
# without tiles; weeks with no upstream change cause no restart at all.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: planetiler-tile-refresh
  namespace: logistics
  labels:
    app: tileserver
    component: tile-generation
spec:
  schedule: "15 20 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: tileserver
            component: tile-generation
        spec:
          serviceAccountName: map-data-refresh
          restartPolicy: Never
          initContainers:
            - name: probe
              image: curlimages/curl:8.10.1
              command: [sh, -c]
              args:
                - |
                  if curl -fsI --max-time 20 https://osmdata.openstreetmap.de/download/water-polygons-split-3857.zip >/dev/null; then
                    echo yes > /flags/water; echo "water polygons host reachable"
                  else
                    echo no > /flags/water; echo "water polygons host unreachable, the cached copy will be used"
                  fi
              volumeMounts: [{name: flags, mountPath: /flags}]
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 200m, memory: 64Mi}
            - name: build
              # Pinned to the digest tested on 2026-11-07 (planetiler 0.10.3-SNAPSHOT,
              # build 2026-11-03); the :latest tag is a moving main-branch snapshot.
              image: ghcr.io/onthegomap/planetiler@sha256:b3b48614759d8676739f341b3de028bf852bbc80a0ea70804a2c55681d235c90
              workingDir: /data/tiles-build
              command: [/bin/sh, -c]
              args:
                - |
                  set -e
                  REFRESH="--refresh_osm=true --refresh_natural_earth=true --refresh_lake_centerlines=true"
                  [ "$(cat /flags/water)" = yes ] && REFRESH="$REFRESH --refresh_water_polygons=true"
                  echo "=== build $(date -u) refresh: $REFRESH"
                  java -Xmx4g -cp @/app/jib-classpath-file com.onthegomap.planetiler.Main \
                    --area=kenya --download $REFRESH --download-threads=2 \
                    --download_dir=/data/sources \
                    --output=/data/tiles-build/kenya.new.mbtiles --force \
                    --nodemap-type=sparsearray --storage=mmap
              securityContext: {runAsUser: 0}
              volumeMounts:
                - {name: media, mountPath: /data}
                - {name: flags, mountPath: /flags}
              resources:
                requests: {cpu: "1", memory: 3Gi}
                limits: {cpu: "4", memory: 6Gi}
          containers:
            - name: publish
              image: alpine/k8s:1.30.0
              command: [/bin/bash, -c]
              args:
                - |
                  set -uo pipefail
                  BUILD=/data/tiles-build; NEW=$BUILD/kenya.new.mbtiles
                  LIVE=/data/tiles/kenya.mbtiles; PREV=/data/tiles/kenya.prev.mbtiles
                  SVC=http://tileserver.logistics.svc.cluster.local:8080
                  KEY='planetiler:osm:osmosisreplicationseq'
                  log(){ echo "$(date -u +%T) $*"; }
                  served_seq(){ curl -fsS --max-time 10 $SVC/data/v3.json | jq -r --arg k "$KEY" '.[$k] // empty'; }
                  # Validate the new archive and read its OSM sequence (fails on a corrupt file)
                  NEW_SEQ=$(python3 - "$NEW" <<'PY'
                  import sqlite3, sys
                  c = sqlite3.connect('file:' + sys.argv[1] + '?mode=ro', uri=True)
                  assert c.execute('pragma quick_check').fetchone()[0] == 'ok', 'integrity check failed'
                  n = c.execute('select count(*) from tiles').fetchone()[0]
                  assert n > 100000, f'only {n} tiles'
                  m = dict(c.execute('select name, value from metadata'))
                  print(int(m['planetiler:osm:osmosisreplicationseq']))
                  PY
                  ) || { log "new archive failed validation"; rm -rf "$BUILD"; exit 1; }
                  OLD_SEQ=$(served_seq) || { log "tileserver not answering before swap"; rm -rf "$BUILD"; exit 1; }
                  log "served OSM sequence $OLD_SEQ, new archive $NEW_SEQ"
                  if [ "$NEW_SEQ" -le "${OLD_SEQ:-0}" ]; then
                    log "upstream has not changed, nothing to publish"; rm -rf "$BUILD"; exit 0
                  fi
                  restart(){ kubectl -n logistics rollout restart deployment/tileserver && kubectl -n logistics rollout status deployment/tileserver --timeout=600s; }
                  mv -f "$LIVE" "$PREV" && mv "$NEW" "$LIVE" || { log "swap failed"; exit 1; }
                  restart
                  OK=no
                  for i in $(seq 1 60); do
                    S=$(served_seq 2>/dev/null)
                    T=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 $SVC/data/v3/14/9814/8196.pbf 2>/dev/null)
                    [ "$S" = "$NEW_SEQ" ] && [ "$T" = 200 ] && { OK=yes; break; }
                    sleep 5
                  done
                  if [ $OK = yes ]; then
                    log "published: tileserver now serves OSM sequence $NEW_SEQ"
                    rm -f "$PREV"; rm -rf "$BUILD"; exit 0
                  fi
                  log "verification failed (served=$S tile=$T), restoring the previous archive"
                  mv -f "$PREV" "$LIVE"; restart; rm -rf "$BUILD"; exit 1
              volumeMounts: [{name: media, mountPath: /data}]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: tileserver-media
            - name: flags
              emptyDir: {}
