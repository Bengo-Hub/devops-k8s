# Stalwart Mail Server — Codevertex email hosting platform.
# Mirrors manifests/databases/postgresql-statefulset.yaml's single-file pattern
# (Service + headless Service + ConfigMap + StatefulSet together).
#
# NOTE (2026-08-10): the TOML config below follows Stalwart's documented config-file
# schema as of the version this plan targets. Validate it against the actual pinned
# image's `stalwart --help`/docs before the first real deploy — Stalwart's config
# surface has changed across releases, and this has not yet been smoke-tested live.
# See .claude/plans/codevertex-email-hosting-service-plan.md Parts 0/5/6 for the
# DNS/hostname/rate-limit decisions this config implements.
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail
  namespace: email
  labels:
    app: stalwart-mail
spec:
  type: ClusterIP
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
      protocol: TCP
    - name: smtps
      port: 465
      targetPort: smtps
      protocol: TCP
    - name: submission
      port: 587
      targetPort: submission
      protocol: TCP
    - name: imaps
      port: 993
      targetPort: imaps
      protocol: TCP
    - name: pop3s
      port: 995
      targetPort: pop3s
      protocol: TCP
    - name: sieve
      port: 4190
      targetPort: sieve
      protocol: TCP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: stalwart-mail
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail-hl
  namespace: email
  labels:
    app: stalwart-mail
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: stalwart-mail
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
  namespace: email
data:
  config.toml: |
    [server]
    hostname = "mx1.codevertexafrica.com"

    [server.listener."smtp"]
    bind = ["0.0.0.0:25"]
    protocol = "smtp"

    [server.listener."submission"]
    bind = ["0.0.0.0:587"]
    protocol = "smtp"
    tls.implicit = false

    [server.listener."smtps"]
    bind = ["0.0.0.0:465"]
    protocol = "smtp"
    tls.implicit = true

    [server.listener."imaps"]
    bind = ["0.0.0.0:993"]
    protocol = "imap"
    tls.implicit = true

    [server.listener."pop3s"]
    bind = ["0.0.0.0:995"]
    protocol = "pop3"
    tls.implicit = true

    [server.listener."sieve"]
    bind = ["0.0.0.0:4190"]
    protocol = "managesieve"

    [server.listener."http"]
    bind = ["0.0.0.0:8080"]
    protocol = "http"

    # Fallback admin bootstrap account, added 2026-08-10 — without this block
    # the STALWART_ADMIN_PASSWORD env var was injected into the pod but never
    # actually wired into Stalwart's own auth config, so the admin API/webadmin
    # login returned 401 for every attempt. Matches the same %{env:...}%
    # interpolation already proven working for the Postgres password below.
    [authentication.fallback-admin]
    user = "admin"
    secret = "%{env:STALWART_ADMIN_PASSWORD}%"

    # PostgreSQL backend — reuses the existing shared postgresql-0 instance,
    # per Part 2's rationale (single DB to operate, not a new storage engine).
    [store."postgresql"]
    type = "postgresql"
    host = "postgresql.infra.svc.cluster.local"
    port = 5432
    database = "stalwart_mail"
    user = "stalwart"
    password = "%{env:POSTGRES_PASSWORD}%"

    [storage]
    data = "postgresql"
    blob = "postgresql"
    fts = "postgresql"
    lookup = "postgresql"
    directory = "internal"

    [directory."internal"]
    type = "internal"
    store = "postgresql"

    # 4-layer rate-limiting Layer 1 (authoritative) — Part 6 of the plan.
    # Per-mailbox/tenant/global limits are written here by email-provisioner
    # at license-assign time; these are the platform-wide floor. Fixed 2026-08-10:
    # the original "*"="1200/1h,20/1m" shorthand and "20gb" size string were both
    # invalid against the real v0.11.8 schema (non-fatal parse errors, settings
    # were silently skipped) — corrected to the documented rate/size object form.
    [queue.limiter.inbound."platform-global"]
    rate = "1200/1h"

    [queue.quota."default"]
    messages = 50000
    size = 21474836480

    # Spam filter — Part 6: DNSBL via a LOCAL resolver (public resolvers silently
    # NXDOMAIN Spamhaus queries above a low volume, making checks look like they
    # pass when they never ran — do not point this at the cluster's default DNS
    # without confirming a local unbound/CoreDNS resolver is in front of it).
    [spam-filter]
    enable = true

    [spam-filter.dnsbl]
    enable = true

    [spam-filter.threshold]
    reject = 15.0
    # scoreDiscard intentionally NOT set — reject, never silently discard, per Part 6.

    # Greylisting deliberately NOT enabled blanket (Part 6) — delays OTP/password-reset
    # mail by minutes, a top small-host complaint. Gate it to already-suspicious mail
    # only if used at all, as a later tuning pass.

    [auth.fail2ban]
    enable = true

    [tracing]
    level = "info"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart-mail
  namespace: email
  labels:
    app: stalwart-mail
spec:
  serviceName: stalwart-mail-hl
  replicas: 1
  selector:
    matchLabels:
      app: stalwart-mail
  template:
    metadata:
      labels:
        app: stalwart-mail
    spec:
      priorityClassName: db-critical
      securityContext:
        # Fixed 2026-08-10: the stalwartlabs/stalwart image defines its own
        # "stalwart" user at uid/gid 2000 (confirmed via /etc/passwd inside
        # the running container), NOT 1000 like most other services' images
        # in this fleet. Running as 1000 meant the container couldn't write
        # to /etc/stalwart (owned by uid 2000) at all, causing the setup
        # wizard's "Local registry write error... Permission denied" on
        # every attempt to save data store settings.
        fsGroup: 2000
        runAsUser: 2000
        runAsGroup: 2000
        runAsNonRoot: true
      initContainers:
        # Fixed 2026-08-10: the pinned --config path (see below) points at
        # /var/lib/stalwart/etc/config.toml, but Stalwart does not create
        # missing parent directories itself — a fresh PVC with no etc/
        # directory yet fails every wizard save with "No such file or
        # directory (os error 2)". Idempotent — safe to run on every start.
        # Also creates logs/ (fixed 2026-08-11): the wizard's Step 4 "Log
        # file" destination (/var/lib/stalwart/logs/) hits the exact same
        # missing-directory bug — Stalwart silently drops every log line
        # instead of erroring, so this went unnoticed until a delivery
        # issue needed log evidence and none existed.
        - name: ensure-etc-dir
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /var/lib/stalwart/etc /var/lib/stalwart/logs"]
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
          volumeMounts:
            - name: data
              mountPath: /var/lib/stalwart
      containers:
        - name: stalwart-mail
          # Pin to a specific tag before first deploy — NOT :latest, per Part 6.
          # CORRECTED AGAIN 2026-08-10: `stalwartlabs/mail-server` is the project's
          # OLD, abandoned Docker Hub repo (stale since 2025-04-30, capped at
          # v0.11.8) — the project renamed to `stalwartlabs/stalwart` and has
          # active releases up to v0.16.16 there. The bundled webadmin SPA in the
          # image requires core server >=0.13.0, so v0.11.8 rejected every login
          # attempt with "Unsupported server version" despite the auth itself
          # working. Corrected to the real, current repo + latest tag.
          image: stalwartlabs/stalwart:v0.16.16-alpine
          imagePullPolicy: IfNotPresent
          # Fixed 2026-08-10: without an explicit --config flag, this image's
          # entrypoint uses some undocumented default config path that is
          # NOT under /var/lib/stalwart or /etc/stalwart (confirmed both
          # empty after the setup wizard reported "Setup complete" and a
          # restart wiped it — the wizard's write never landed on our
          # persistent volume at all). `stalwart --help` confirms `-c/--config
          # <PATH>` is the explicit way to pin this rather than guess the
          # default. Forcing it under /var/lib/stalwart (the persistent PVC,
          # already correctly owned by uid 2000) so the wizard's write and
          # every subsequent restart agree on the same real location.
          args: ["--config", "/var/lib/stalwart/etc/config.toml"]
          ports:
            - name: smtp
              containerPort: 25
            - name: submission
              containerPort: 587
            - name: smtps
              containerPort: 465
            - name: imaps
              containerPort: 993
            - name: pop3s
              containerPort: 995
            - name: sieve
              containerPort: 4190
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-mail
                  key: postgres-password
            - name: STALWART_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-mail
                  key: admin-password
            # v0.16.x bootstrap fix (2026-08-10): the wizard-based first-run
            # flow is unreliable (browser asset-loading errors after a pod
            # restart re-downloads a different webui.zip build). This env
            # var, per Stalwart's own bootstrap banner ("to pin a credential
            # instead, set STALWART_RECOVERY_ADMIN=admin:<password>"), pins a
            # permanent login without needing the wizard at all. Real value
            # lives only in the K8s Secret, never in this file.
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-mail
                  key: recovery-admin
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            # v0.16.x's data root is /var/lib/stalwart (PWD in the container),
            # not /opt/stalwart-mail (that path only existed on the old, now-
            # abandoned v0.11.x image).
            #
            # The ConfigMap-mounted config.toml (used for the old v0.11.x
            # declarative-TOML bootstrap) is REMOVED as of 2026-08-10: v0.16.x
            # ignores it entirely (runs the interactive setup wizard instead),
            # and the subPath mount into etc/config.toml caused kubelet to
            # auto-create /var/lib/stalwart/etc as root:root 755 — a directory
            # the container's non-root user (1000) can't write into, which is
            # exactly what broke the wizard's "Finish setup" step ("Local
            # registry write error... Permission denied"). Only the data PVC
            # is mounted now; the wizard creates etc/ itself, correctly owned,
            # the first time it successfully writes there.
            - name: data
              mountPath: /var/lib/stalwart
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: stalwart-mail
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          # Fixed at creation — local-path StorageClass has ALLOWVOLUMEEXPANSION=false
          # (confirmed live 2026-08-10). Size deliberately; see plan Part 9.
          requests:
            storage: 50Gi
