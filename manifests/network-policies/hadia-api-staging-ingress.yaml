# hadia-api-staging ingress policy, cloned from hadia-api-ingress.yaml for the staging stack
# (namespace hadia-staging): ingress-nginx for api.staging.hadiafrica.com, hadia-ui-staging's
# server components from its own namespace, and auth-api for SSO tenant backups. Live's namespace
# hadia is not on this list, so live never calls the staging API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hadia-api-staging-ingress
  namespace: hadia-staging
spec:
  podSelector:
    matchLabels:
      app: hadia-api-staging
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hadia-staging
      ports:
        - protocol: TCP
          port: 4000
