# Extends the NetworkPolicy pilot to inventory-api. Ingress-only — see pos-api-ingress.yaml's
# header comment for why (the shared charts/app Egress template would break cross-namespace S2S).
#
# Consumer namespaces verified by grepping every apps/*/values.yaml for inventory-api's internal
# ClusterIP hostname (inventory-api.inventory.svc.cluster.local): hospital-api, ordering-backend,
# pos-api, treasury-api. Anything not found this way uses inventory-api's public hostname default
# and is already covered by the ingress-nginx allow rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-api-ingress
  namespace: inventory
spec:
  podSelector:
    matchLabels:
      app: inventory-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inventory
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hospital
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ordering
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pos
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: treasury
      ports:
        - protocol: TCP
          port: 4000
        - protocol: TCP
          port: 9090
