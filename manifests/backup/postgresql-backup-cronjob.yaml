apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgresql-backup
  namespace: infra
spec:
  schedule: "0 2 * * *"  # Daily at 2am UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            # Run as non-root user with write access to backup PVC
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          initContainers:
            # `apk add rclone` inside pg-backup itself needs root (writes the system package
            # db) and pg-backup deliberately runs non-root — confirmed live: apk update/apk
            # add both succeed as root but silently fail under runAsUser 999. Standard fix:
            # copy the static binary from the official image onto a shared volume instead of
            # installing anything at runtime.
            - name: fetch-rclone
              image: rclone/rclone:1.67
              command: ["sh", "-c", "cp $(command -v rclone) /rclone-bin/rclone && chmod +x /rclone-bin/rclone"]
              volumeMounts:
                - name: rclone-bin
                  mountPath: /rclone-bin
          containers:
            - name: pg-backup
              image: postgres:17-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_DIR="/backups"
                  FILENAME="bengobox_${TIMESTAMP}.sql.gz"
                  DUMPFILE="${BACKUP_DIR}/bengobox_${TIMESTAMP}.sql"

                  # Ensure backup dir is writable
                  mkdir -p ${BACKUP_DIR}

                  # Check available disk space before backup (abort if <2000MB free).
                  # Threshold covers the UNCOMPRESSED intermediate dump file too (see the
                  # two-step dump below) — pg_dumpall output is several times larger than
                  # the final .sql.gz, unlike the old single-pipe approach where only the
                  # compressed size ever touched disk.
                  AVAIL=$(df -m ${BACKUP_DIR} | awk 'NR==2{print $4}')
                  if [ "$AVAIL" -lt 2000 ]; then
                    echo "ERROR: Only ${AVAIL}MB available in backup dir — aborting backup to prevent disk full"
                    exit 1
                  fi
                  echo "Disk space OK: ${AVAIL}MB available"

                  echo "Starting PostgreSQL backup at $(date)"
                  # Platform DR backup: pg_dumpall captures ALL cluster databases (every
                  # per-service DB on the shared postgresql-0) plus globals/roles.
                  #
                  # Dumped to a plain file first, THEN gzipped as a separate step —
                  # deliberately NOT `pg_dumpall | gzip -9 > file` (the original form).
                  # This shell has no pipefail, so a failing/truncated pg_dumpall behind a
                  # pipe is invisible: gzip happily compresses whatever partial input it
                  # gets and exits 0, so the pipeline's exit code is gzip's, not
                  # pg_dumpall's — a broken dump would look "successful" right as this
                  # script is about to delete the only other backup we have (see retention
                  # below). Splitting the steps lets pg_dumpall's own exit code be checked
                  # directly via `set -e`.
                  pg_dumpall -h $PGHOST -U $PGUSER > "${DUMPFILE}"
                  gzip -9 "${DUMPFILE}"

                  if [ ! -s "${BACKUP_DIR}/${FILENAME}" ]; then
                    echo "ERROR: backup file missing or empty after dump - aborting, previous backup(s) left untouched"
                    exit 1
                  fi
                  if ! gzip -t "${BACKUP_DIR}/${FILENAME}"; then
                    echo "ERROR: backup file failed gzip integrity check - aborting, previous backup(s) left untouched"
                    rm -f "${BACKUP_DIR}/${FILENAME}"
                    exit 1
                  fi

                  SIZE=$(du -h "${BACKUP_DIR}/${FILENAME}" | cut -f1)
                  echo "Backup completed and verified: ${FILENAME} (${SIZE})"

                  # Offsite push to Cloudflare R2 — the local PVC above is on the SAME VPS as
                  # postgresql-0 itself, so it's worthless in exactly the failure mode that
                  # matters most (total VPS/host-provider loss, as happened 2026-08-16). This
                  # is best-effort: a failed push never fails the job, since the local dump
                  # (this backup's actual purpose) already succeeded above. Retention below
                  # is gated on this succeeding though — see that comment for why.
                  R2_UPLOAD_OK=false
                  r2() {
                    RCLONE_CONFIG_R2_TYPE=s3 \
                    RCLONE_CONFIG_R2_PROVIDER=Cloudflare \
                    RCLONE_CONFIG_R2_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}" \
                    RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}" \
                    RCLONE_CONFIG_R2_ENDPOINT="${R2_S3_ENDPOINT}" \
                    /rclone-bin/rclone "$@"
                  }
                  R2_PATH="r2:${R2_BUCKET:-codevertex-platform-backups}/postgresql/"

                  if [ -n "${R2_ACCESS_KEY_ID:-}" ] && [ -n "${R2_SECRET_ACCESS_KEY:-}" ] && [ -n "${R2_S3_ENDPOINT:-}" ]; then
                    # rclone binary comes from the fetch-rclone initContainer (shared emptyDir)
                    # — installing it here via apk needs root, and this container deliberately
                    # runs non-root (confirmed live: apk add silently fails under runAsUser 999).
                    if [ -x /rclone-bin/rclone ]; then
                      if r2 copy "${BACKUP_DIR}/${FILENAME}" "${R2_PATH}" --checksum; then
                        echo "Offsite backup pushed to R2: ${FILENAME}"
                        R2_UPLOAD_OK=true
                      else
                        echo "WARN: R2 offsite push failed - local backup on the VPS PVC is still intact"
                      fi
                    else
                      echo "WARN: rclone binary missing (fetch-rclone initContainer) - skipping offsite push, local backup is still intact"
                    fi
                  else
                    echo "WARN: R2 credentials not configured - this backup stays local-VPS-only"
                  fi

                  # Retention: keep exactly ONE backup — the one just verified above — both
                  # locally and on R2, per platform requirement (single most recent COMPLETE
                  # backup, not a rolling window). Pruning only happens after a confirmed
                  # successful R2 upload of the new file: if R2 is unreachable, misconfigured,
                  # or this run's dump/upload had any problem, every previous backup (local
                  # AND remote) is left exactly as-is, so there's always at least one
                  # known-good backup surviving a bad run.
                  if [ "$R2_UPLOAD_OK" = true ]; then
                    echo "New backup verified locally and confirmed on R2 - pruning older backups (keeping only ${FILENAME})"

                    find ${BACKUP_DIR} -name "bengobox_*.sql.gz" ! -name "${FILENAME}" -print -delete

                    R2_OLD=$(r2 lsf "${R2_PATH}" 2>/dev/null || echo "")
                    for f in $R2_OLD; do
                      if [ "$f" != "${FILENAME}" ]; then
                        if r2 deletefile "${R2_PATH}${f}"; then
                          echo "  deleted old R2 backup: ${f}"
                        else
                          echo "  WARN: failed to delete old R2 backup ${f} - it will remain alongside the new one"
                        fi
                      fi
                    done
                  else
                    echo "Skipping retention prune - R2 upload did not succeed this run, so all previous local+R2 backups are left in place as the safety net"
                  fi

                  # Generate manifest.json for auth-api backup listing endpoint
                  echo '{"backups": [' > ${BACKUP_DIR}/manifest.json
                  FIRST=true
                  for f in $(ls -t ${BACKUP_DIR}/bengobox_*.sql.gz 2>/dev/null); do
                    FNAME=$(basename "$f")
                    FSIZE=$(du -h "$f" | cut -f1)
                    FDATE=$(stat -c '%Y' "$f" 2>/dev/null || stat -f '%m' "$f" 2>/dev/null)
                    if [ "$FIRST" = true ]; then FIRST=false; else echo ',' >> ${BACKUP_DIR}/manifest.json; fi
                    echo "{\"filename\": \"${FNAME}\", \"size\": \"${FSIZE}\", \"created_at\": ${FDATE}}" >> ${BACKUP_DIR}/manifest.json
                  done
                  echo ']}' >> ${BACKUP_DIR}/manifest.json

                  echo "Manifest updated. Available backups:"
                  ls -lh ${BACKUP_DIR}/bengobox_*.sql.gz 2>/dev/null || echo "No backups found"
              env:
                # Cloudflare R2 offsite push — see postgresql-backup-r2-secrets (Secret, not
                # committed to git). All optional: absent creds just skip the offsite push
                # with a warning, local backup is unaffected either way.
                - name: R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-backup-r2-secrets
                      key: R2_ACCESS_KEY_ID
                      optional: true
                - name: R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-backup-r2-secrets
                      key: R2_SECRET_ACCESS_KEY
                      optional: true
                - name: R2_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-backup-r2-secrets
                      key: R2_S3_ENDPOINT
                      optional: true
                - name: R2_BUCKET
                  value: "codevertex-platform-backups"
                - name: PGHOST
                  value: "postgresql.infra.svc.cluster.local"
                # PostgreSQL admin user = admin_user (set via POSTGRES_USER in Bitnami chart)
                - name: PGUSER
                  value: "admin_user"
                # Secret name is 'postgresql' (Bitnami chart default), key is 'admin-user-password'
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql
                      key: admin-user-password
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: rclone-bin
                  mountPath: /rclone-bin
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgresql-backup-pvc
            - name: rclone-bin
              emptyDir: {}
---
# The backup-storage PVC (postgresql-backup-pvc) lives in a SEPARATE file:
#   manifests/backup/postgresql-backup-pvc.yaml
# It is intentionally not in this file because `local-path` PVCs are non-resizable,
# so re-applying it after a size change fails. The provision workflow creates that
# PVC create-once (only when absent). This file holds only safely re-appliable
# resources (CronJob, Deployment, ConfigMap, Service).
---
# Lightweight nginx server to serve backup files internally
# Auth-api proxies requests to this service for authenticated platform admins
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-server
  namespace: infra
  labels:
    app: backup-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-server
  template:
    metadata:
      labels:
        app: backup-server
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: seed-manifest
          image: busybox:1.36
          command: ['sh', '-c', 'if [ ! -f /backups/manifest.json ]; then echo ''{"backups": []}'' > /backups/manifest.json; fi']
          volumeMounts:
            - name: backup-storage
              mountPath: /backups
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: backup-storage
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: backup-storage
          persistentVolumeClaim:
            claimName: postgresql-backup-pvc
        - name: nginx-config
          configMap:
            name: backup-server-nginx-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-server-nginx-config
  namespace: infra
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      autoindex off;

      # Only allow manifest.json and .sql.gz files
      location = /manifest.json {
        add_header Content-Type application/json;
      }
      location ~ \.sql\.gz$ {
        add_header Content-Disposition "attachment";
        add_header Content-Type application/gzip;
      }
      location / {
        return 404;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: backup-server
  namespace: infra
spec:
  selector:
    app: backup-server
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
