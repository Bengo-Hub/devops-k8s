# MarketFlow worker: NATS consumers and scheduled jobs (nurture, re-engagement, ad insights,
# chat retention, token health, agents). Same image as marketflow-api, started with
# MF_ROLE=worker: it applies migrations (advisory-locked, idempotent) and then runs
# /usr/local/bin/marketflow-worker in the foreground. Split out of the API pod (Sprint 14) so a
# crash is restarted by its own probe, heavy jobs cannot starve or OOM the API, and the
# scheduler gives way to the business apps first (batch-low).
#
# The image is moved to each marketflow-api release by marketflow-api's build.sh
# (update_plain_manifest_image), the same pattern as auth-session-cleanup. The env mirrors
# apps/marketflow-api/values.yaml; keep the two in step when adding worker settings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketflow-worker
  namespace: marketflow
  labels:
    app: marketflow-worker
    component: worker
spec:
  # Jobs are lock-guarded and consumers are durable, so a second replica would only add
  # availability. One is enough on a single node.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: marketflow-worker
  template:
    metadata:
      labels:
        app: marketflow-worker
        component: worker
    spec:
      priorityClassName: batch-low
      # Long uploads and outbox drains get time to finish on shutdown.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: worker
          image: docker.io/codevertex/marketflow-api:94a548f9
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 4002
          envFrom:
            # Shared object storage (OBJECT_STORAGE_*), optional until the Secret exists.
            - secretRef:
                name: object-storage
                optional: true
          env:
            - name: MF_ROLE
              value: worker
            - name: APP_ENV
              value: production
            - name: HTTP_PORT
              value: "4000"
            - name: HTTP_ALLOWED_ORIGINS
              value: "https://marketflow.codevertexafrica.com,https://accounts.codevertexafrica.com"
            # Database
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: marketflow-api-secrets
                  key: POSTGRES_URL
            # Direct PostgreSQL URL for migrate/seed (bypasses PgBouncer transaction mode)
            - name: POSTGRES_MIGRATE_URL
              valueFrom:
                secretKeyRef:
                  name: marketflow-api-secrets
                  key: POSTGRES_MIGRATE_URL
                  optional: true
            - name: POSTGRES_MAX_OPEN_CONNS
              value: "4"
            - name: POSTGRES_MAX_IDLE_CONNS
              value: "2"
            - name: POSTGRES_CONN_MAX_LIFETIME
              value: "15m"
            - name: POSTGRES_RUN_MIGRATIONS
              value: "false"
            # Redis
            - name: REDIS_ADDR
              value: redis-master.infra.svc.cluster.local:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marketflow-api-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: REDIS_NAMESPACE
              value: marketflow
            # NATS Events
            - name: MF_EVENTS_NATS_URL
              value: "nats://nats.messaging.svc.cluster.local:4222,nats://nats.codevertexafrica.com:4222"
            - name: MF_EVENTS_ENABLED
              value: "true"
            # Security (JWT via auth-api JWKS)
            - name: MF_SECURITY_REQUIRE_JWT
              value: "true"
            - name: MF_SECURITY_JWKS_URL
              value: "https://sso.codevertexafrica.com/api/v1/.well-known/jwks.json"
            - name: MF_SECURITY_JWT_ISSUER
              value: "https://sso.codevertexafrica.com"
            - name: MF_SECURITY_JWT_AUDIENCE
              value: "codevertex"
            - name: MF_SECURITY_AUTH_SERVICE_URL
              value: "https://sso.codevertexafrica.com"
            # 32-byte base64 key used to encrypt ProviderSetting secrets at rest.
            # Must be populated before any provider_configure call with secret_keys;
            # rotation requires re-encrypting existing rows.
            - name: MF_SECURITY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: marketflow-api-secrets
                  key: ENCRYPTION_KEY
                  optional: true
            - name: MF_META_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: marketflow-api-secrets
                  key: META_VERIFY_TOKEN
                  optional: true
            # Meta Marketing API
            - name: MF_META_APP_ID
              valueFrom:
                secretKeyRef:
                  name: marketflow-api-secrets
                  key: META_APP_ID
                  optional: true
            - name: MF_META_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: marketflow-api-secrets
                  key: META_APP_SECRET
                  optional: true
            # AI / LLM
            - name: MF_AI_OLLAMA_URL
              value: "http://ollama.shared-infra.svc.cluster.local:11434"
            - name: MF_AI_OLLAMA_MODEL
              value: "llama3.1:8b"
            - name: MF_AI_CLAUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: marketflow-api-secrets
                  key: CLAUDE_API_KEY
                  optional: true
            - name: MF_AI_EMBEDDING_MODEL
              value: "nomic-embed-text"
            - name: MF_AI_EMBEDDING_DIM
              value: "768"
            # ── Worker sidecar env (NATS consumer runs inside the same pod) ────────────
            - name: NATS_URL
              value: "nats://nats.messaging.svc.cluster.local:4222"
            # Stream names are case-sensitive: prod's stream is lowercase "marketflow".
            # The old "MARKETFLOW" value named a stream that never existed, killing the
            # in-container worker at startup on every boot (consumers never registered).
            - name: NATS_STREAM
              value: "marketflow"
            - name: WORKER_HTTP_PORT
              value: "4002"
            - name: SCHEDULER_INTERVAL_SECONDS
              value: "60"
            - name: SCHEDULER_BATCH_SIZE
              value: "50"
            - name: MF_WORKER_API_URL
              value: "http://marketflow-api.marketflow.svc.cluster.local:4000"
            - name: MF_WORKER_AI_URL
              value: "http://marketflow-ai.marketflow.svc.cluster.local:4001"
            - name: MF_WORKER_TICKETING_URL
              value: "http://ticketing-api.ticketing.svc.cluster.local:4009"
            - name: MF_WORKER_OLLAMA_URL
              value: "http://ollama.shared-infra.svc.cluster.local:11434"
            - name: MF_WORKER_EMBEDDING_MODEL
              value: "nomic-embed-text"
            - name: NOTIFICATIONS_URL
              value: "http://notifications-api.notifications.svc.cluster.local:4000"
            # Cross-service CRM S2S URLs (Sprint 11)
            - name: MF_CROSS_ORDERING_URL
              value: "http://ordering-backend.ordering.svc.cluster.local:4000"
            - name: MF_CROSS_POS_URL
              value: "http://pos-api.pos.svc.cluster.local:4000"
            - name: MF_CROSS_TREASURY_URL
              value: "http://treasury-api.treasury.svc.cluster.local:4000"
            - name: MF_CROSS_INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: marketflow-api-secrets
                  key: INTERNAL_SERVICE_KEY
                  optional: true
            # Shared S2S key — used for outbound calls to notifications-api and subscriptions-api
            - name: INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: marketflow-api-secrets
                  key: INTERNAL_SERVICE_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # Startup includes migrations, so readiness and liveness wait for it.
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
