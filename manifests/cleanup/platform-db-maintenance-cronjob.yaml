# Platform Maintenance CronJob
#
# Runs nightly at 20:45 UTC (23:45 EAT), after the 23:30 backup. Purges old records
# across all service databases. Node cleanup (images, OS packages) lives in
# cluster-daily-cleanup, manifests/cleanup-cronjob.yaml.
#
# Uses the admin_user (postgresql secret) to connect directly to each DB.
#
# Cleanup policy:
#   outbox_events (PUBLISHED):  DELETE after 7 days (belt-and-braces; shared-events
#                               now prunes on publish, but cleans any legacy rows)
#   outbox_events (FAILED):     DELETE after 7 days (kept briefly for troubleshooting)
#   Logistics telemetry_points: DELETE after 90 days (captured_at)
#   MarketFlow chat_sessions:   DELETE after 90 days without activity
#   Audit log tables:           DELETE after 30 days, every database (owner decision
#                               2026-11-06, truload and kuraweigh included)
#   auth sessions:              expired or revoked (safety net)
#
# NOTE: outbox status filters use UPPER(status) because shared-events writes
# 'PENDING'/'PUBLISHED'/'FAILED' (uppercase). A previous lowercase filter never
# matched, so published/failed rows were never pruned.
#
# 2026-11-06: four of these cleanups had never worked (telemetry_points and
# chat_sessions have no created_at; auth and ordering audit logs use occurred_at)
# and the job still reported success because errors were only printed. Every
# target is now matched to its real columns and any failure fails the Job.
#
# Safe by design:
#   - Connects via direct PostgreSQL (not PgBouncer) to avoid transaction-mode limits on DELETE
#   - Deletes in batches of 10000 rows so a backlog never becomes one long transaction
#   - Each statement is a separate psql call, so one failure does not stop the rest
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-db-maintenance
  namespace: infra
  labels:
    app: platform-db-maintenance
    component: maintenance
spec:
  schedule: "45 20 * * *"  # 23:45 EAT, right after the 23:30 backup so a fresh copy exists before anything is deleted
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 7200
      activeDeadlineSeconds: 1800  # 30 minute max
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: platform-db-maintenance
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
          containers:
            - name: db-maintenance
              image: postgres:17-alpine
              command:
                - /bin/sh
                - -c
                - |
                  PG="postgresql.infra.svc.cluster.local"
                  CONN_OPTS="-h $PG -U $PGUSER"

                  echo "=== Platform DB Maintenance ($(date -u)) ==="

                  # ─────────────────────────────────────────────────────────
                  # OUTBOX EVENT CLEANUP (every database that has the table)
                  # Delete published events older than 7 days
                  # Delete failed events older than 7 days (exhausted retries)
                  #
                  # 2026-11-06: databases are discovered from pg_database instead
                  # of a hand-kept list. The old list had drifted: bengo_erp,
                  # hospital, library, maskani and isp_billing all have an
                  # outbox_events table and were never pruned. Two schemas exist:
                  #   shared-events (Go):  status + published_at + last_attempt_at
                  #   isp-billing (Python): published_at + attempts, no status
                  #                         (poison rows stop at attempts >= 10,
                  #                         MAX_PUBLISH_ATTEMPTS in app/events/outbox.py)
                  # The SQL is picked from the columns the table really has, so a
                  # schema the job does not know is skipped with a note, never
                  # half-matched. Deletes run in batches of 10000 so a large
                  # backlog never becomes one long transaction.
                  # ─────────────────────────────────────────────────────────
                  # Shared batched delete for every cleanup in this job. Rows are
                  # addressed by ctid so it works whatever a table's key is called
                  # (the .NET truload schema differs from the Go services). A failure
                  # is counted and fails the Job at the end: the old run_sql only
                  # printed WARN, which hid four broken cleanups for months.
                  FAILS=0
                  prune_batched() { # DB TABLE LABEL WHERE
                    local DB="$1" TABLE="$2" LABEL="$3" WHERE="$4" TOTAL=0 N=0 I=0
                    while [ $I -lt 100 ]; do
                      N=$(psql $CONN_OPTS -d "$DB" -At -v ON_ERROR_STOP=1 -c "WITH deleted AS (DELETE FROM $TABLE WHERE ctid IN (SELECT ctid FROM $TABLE WHERE $WHERE LIMIT 10000) RETURNING 1) SELECT COUNT(*) FROM deleted;" 2>&1) || { echo ""; echo "[$DB] $LABEL"; echo "  -> FAILED: $N"; FAILS=$((FAILS + 1)); return; }
                      TOTAL=$((TOTAL + N)); I=$((I + 1))
                      [ "$N" -lt 10000 ] && break
                    done
                    echo ""; echo "[$DB] $LABEL"; echo "  -> $TOTAL rows affected"
                  }
                  # Column check used to pick the right timestamp, or skip with a note.
                  has_col() { # DB TABLE COLUMN
                    [ "$(psql $CONN_OPTS -d "$1" -At -c "SELECT 1 FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = '$2' AND column_name = '$3'" 2>/dev/null)" = 1 ]
                  }

                  DBS=$(psql $CONN_OPTS -d postgres -At -c "SELECT datname FROM pg_database WHERE NOT datistemplate AND datallowconn AND datname <> 'postgres' ORDER BY 1")
                  for DB in $DBS; do
                    COLS=$(psql $CONN_OPTS -d "$DB" -At -c "SELECT string_agg(column_name, ',' ORDER BY column_name) FROM information_schema.columns WHERE table_schema = current_schema() AND table_name = 'outbox_events' AND column_name IN ('status','published_at','attempts','last_attempt_at')" 2>/dev/null)
                    case "$COLS" in
                      "") ;;  # no outbox_events table in this database
                      *status*)
                        prune_batched "$DB" outbox_events "outbox: delete published >7d" "UPPER(status) = 'PUBLISHED' AND published_at < NOW() - INTERVAL '7 days'"
                        prune_batched "$DB" outbox_events "outbox: delete failed >7d" "UPPER(status) = 'FAILED' AND COALESCE(last_attempt_at, created_at) < NOW() - INTERVAL '7 days'"
                        ;;
                      attempts,published_at)
                        prune_batched "$DB" outbox_events "outbox: delete published >7d" "published_at IS NOT NULL AND published_at < NOW() - INTERVAL '7 days'"
                        prune_batched "$DB" outbox_events "outbox: delete poison >7d" "published_at IS NULL AND attempts >= 10 AND created_at < NOW() - INTERVAL '7 days'"
                        ;;
                      *) echo ""; echo "[$DB] outbox: unknown schema ($COLS), skipped" ;;
                    esac
                  done

                  # ─────────────────────────────────────────────────────────
                  # LOGISTICS TELEMETRY (90 days). The column is captured_at:
                  # the old SQL used created_at, which the table does not have,
                  # so this cleanup had never worked.
                  # ─────────────────────────────────────────────────────────
                  prune_batched logistics telemetry_points "telemetry_points >90d" "captured_at < NOW() - INTERVAL '90 days'"

                  # ─────────────────────────────────────────────────────────
                  # MARKETFLOW CHAT SESSIONS (90 days since last activity, so a
                  # session still in use is never cut). Same created_at bug as above.
                  # ─────────────────────────────────────────────────────────
                  prune_batched marketflow chat_sessions "chat_sessions >90d idle" "COALESCE(last_activity_at, ended_at, started_at) < NOW() - INTERVAL '90 days'"

                  # ─────────────────────────────────────────────────────────
                  # AUDIT LOG CLEANUP: 30 days for every audit log table in every
                  # database (owner decision 2026-11-06, truload and kuraweigh
                  # included). Tables are discovered: audit_logs, any *_audit_logs
                  # (hospital rbac_audit_logs) and erp's payslip_audits. Physical
                  # asset audits (inventory asset_audits) are business records, not
                  # logs, and are not matched. The timestamp is taken from the
                  # columns each table really has: auth and ordering write
                  # occurred_at, not created_at, and the old fixed SQL failed on
                  # both every night; the old DB list also missed six databases.
                  # ─────────────────────────────────────────────────────────
                  for DB in $DBS; do
                    TABLES=$(psql $CONN_OPTS -d "$DB" -At -c "SELECT table_name FROM information_schema.tables WHERE table_schema = current_schema() AND table_type = 'BASE TABLE' AND (table_name = 'audit_logs' OR table_name LIKE '%\_audit\_logs' OR table_name = 'payslip_audits') ORDER BY 1" 2>/dev/null)
                    for T in $TABLES; do
                      COL=""
                      for C in occurred_at created_at action_date; do has_col "$DB" "$T" "$C" && { COL=$C; break; }; done
                      if [ -z "$COL" ]; then echo ""; echo "[$DB] $T: no known timestamp column, skipped"; FAILS=$((FAILS + 1)); continue; fi
                      prune_batched "$DB" "$T" "$T >30d ($COL)" "$COL < NOW() - INTERVAL '30 days'"
                    done
                  done

                  # ─────────────────────────────────────────────────────────
                  # AUTH SESSION CLEANUP (safety net; the auth-session-cleanup
                  # CronJob in the auth namespace is the primary cleaner)
                  # ─────────────────────────────────────────────────────────
                  prune_batched auth sessions "sessions: expired" "expires_at < NOW()"
                  prune_batched auth sessions "sessions: revoked" "status = 'revoked'"

                  echo ""
                  echo "=== Maintenance complete ($(date -u)), failures: $FAILS ==="
                  [ "$FAILS" -eq 0 ]
              env:
                - name: PGUSER
                  value: "admin_user"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql
                      key: admin-user-password
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
