# Tenant domains (auth-api internal/services/domains): lets auth-api create, update and delete the
# Ingress objects it owns for tenants' own hostnames, and read cert-manager Certificates to know
# when a domain's TLS is ready. Scoped per app namespace (the domains service catalogue), nothing
# cluster wide; it never touches Secrets. Objects it manages carry the label
# codevertex.io/tenant-domain=true. Apply: kubectl apply -f manifests/auth-api-domains-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-api-domains
  namespace: erp
rules:
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-api-domains
  namespace: erp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-api-domains
subjects:
- kind: ServiceAccount
  name: auth-api-monitor
  namespace: auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-api-domains
  namespace: inventory
rules:
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-api-domains
  namespace: inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
