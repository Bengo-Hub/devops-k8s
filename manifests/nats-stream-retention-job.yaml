# NATS JetStream stream retention enforcement
#
# Runs every 6 hours. Caps every stream at MaxAge 7 days and MaxBytes 512MiB, and
# streams named *-dlq at 14 days and 256MiB. JetStream allows 10GiB per server and
# every R3 stream is stored on every server, so 18 streams x 512MiB (9GiB) keeps the
# store from filling. Largest stream on 2026-11-06: inventory, 11MB.
#
# Rewritten 2026-11-06. The old version kept a hand-written list of streams, called
# "nats stream edit" without -f (it needs a confirm prompt that a Job cannot answer)
# and swallowed the error with "|| echo WARN", so for months it changed nothing while
# reporting success. Every stream that did have a limit got it from its own app.
# hospital, projects and ticketing create their streams with no MaxAge and had grown
# without limit; the list also named six DLQ streams and an iot stream that do not
# exist and missed hospital, digitika, erp, isp, library, maskani and tenant.
#
# Now: streams are discovered from the server, limits only ever tighten (a stream an
# app keeps for 3 days is never lengthened to 7), the edit is forced, and any failure
# fails the Job. Only retention fields change; nothing is deleted or recreated.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nats-stream-retention
  namespace: messaging
  labels:
    app: nats-stream-retention
    component: maintenance
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 300
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: nats-stream-retention
        spec:
          restartPolicy: Never
          containers:
            - name: nats-cli
              image: natsio/nats-box:0.14.5
              command:
                - /bin/sh
                - -c
                - |
                  NATS="nats --server=nats://nats.messaging.svc.cluster.local:4222"
                  DAY_NS=86400000000000
                  STREAMS=$($NATS stream ls -n 2>/dev/null)
                  [ -n "$STREAMS" ] || { echo "ERROR: could not list streams"; exit 1; }
                  echo "=== NATS stream retention ($(date -u)) ==="
                  CHANGED=0; OK=0; FAILED=0
                  for S in $STREAMS; do
                    case "$S" in
                      *-dlq) AGE_D=14; MAX_BYTES=268435456 ;;
                      *)     AGE_D=7;  MAX_BYTES=536870912 ;;
                    esac
                    J=$($NATS stream info "$S" --json 2>/dev/null) || { echo "WARN: info failed $S"; FAILED=$((FAILED + 1)); continue; }
                    AGE=$(echo "$J" | jq -r '.config.max_age')
                    BYTES=$(echo "$J" | jq -r '.config.max_bytes')
                    ARGS=""
                    # 0 means unlimited; tighten only, never lengthen a shorter app setting
                    if [ "$AGE" -eq 0 ] || [ "$AGE" -gt $((AGE_D * DAY_NS)) ]; then ARGS="$ARGS --max-age=${AGE_D}d"; fi
                    if [ "$BYTES" -lt 0 ] || [ "$BYTES" -gt "$MAX_BYTES" ]; then ARGS="$ARGS --max-bytes=$MAX_BYTES"; fi
                    if [ -z "$ARGS" ]; then OK=$((OK + 1)); continue; fi
                    if $NATS stream edit "$S" $ARGS -f >/dev/null 2>&1; then
                      echo "set $S:$ARGS"; CHANGED=$((CHANGED + 1))
                    else
                      echo "WARN: edit failed $S:$ARGS"; FAILED=$((FAILED + 1))
                    fi
                  done
                  echo "streams: changed=$CHANGED within_policy=$OK failed=$FAILED"
                  [ "$FAILED" -eq 0 ]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
---
# NATS JetStream consumer policy enforcement (2026-11-06)
#
# 1. Replicas 1. All 3 nats pods run on the one node, so an R3 consumer gives no
#    node-level protection, only cover for one nats pod crashing, while its raft
#    traffic cost ~460 route messages a second and ~800m CPU (a quarter of real node
#    CPU). Streams stay R3 so message data remains replicated. An R1 consumer whose
#    nats pod restarts resumes from its on-disk state when the pod is back. Moving all
#    297 consumers cut NATS to ~80m and route traffic to ~25 messages a second.
# 2. InactiveThreshold 7 days. A durable whose subscriber is gone (feature turned
#    off, durable renamed, code removed) otherwise collects messages forever; 21 such
#    durables were found, some silent since June. With the threshold the server
#    deletes a durable that has had no subscriber for 7 days. Nothing is lost by that:
#    every stream is capped at 7 days or less (nats-stream-retention above), so any
#    message the durable had not taken has already aged out. A service that comes
#    back after a longer outage gets a fresh durable with its own deliver policy.
#
# Enforced server side rather than in shared/events so it covers every client (Go,
# .NET, nats.js, Python) and consumers created later. nats.go only compares replicas
# when the client sets them, so services re-binding to an R1 durable keep working,
# and setting nats.ConsumerReplicas(1) in the library would make binds to existing
# R3 durables fail.
#
# Limits-retention streams only: the server requires consumer replicas to match the
# stream on interest and work-queue streams, so those are skipped. Idempotent.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nats-consumer-replicas
  namespace: messaging
  labels:
    app: nats-consumer-replicas
    component: maintenance
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 7200
      activeDeadlineSeconds: 1200
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: nats-consumer-replicas
        spec:
          restartPolicy: Never
          containers:
            - name: nats-cli
              image: natsio/nats-box:0.14.5
              env:
                # Staged 2026-11-05/06: library, then auth and notifications, each
                # verified (bindings intact, real deliveries, nothing pending) before
                # widening. Empty means every stream, the steady state.
                - name: ONLY_STREAMS
                  value: ""
              command:
                - /bin/sh
                - -c
                - |
                  NATS="nats --server=nats://nats.messaging.svc.cluster.local:4222"
                  STREAMS="${ONLY_STREAMS:-$($NATS stream ls -n 2>/dev/null)}"
                  [ -n "$STREAMS" ] || { echo "ERROR: could not list streams"; exit 1; }
                  THRESHOLD_NS=604800000000000   # 7 days
                  EDITED=0; ALREADY=0; SKIPPED=0; FAILED=0
                  for S in $STREAMS; do
                    case "$($NATS stream info "$S" --json 2>/dev/null | jq -r '.config.retention')" in
                      limits) ;;
                      *) echo "skip stream $S: not limits retention or info failed"; SKIPPED=$((SKIPPED + 1)); continue ;;
                    esac
                    for C in $($NATS consumer ls "$S" -n 2>/dev/null); do
                      INFO=$($NATS consumer info "$S" "$C" --json 2>/dev/null) || { echo "WARN: info failed $S/$C"; FAILED=$((FAILED + 1)); continue; }
                      REP=$(echo "$INFO" | jq -r '.config.num_replicas // 0')
                      INACT=$(echo "$INFO" | jq -r '.config.inactive_threshold // 0')
                      ARGS=""
                      [ "$REP" = 1 ] || ARGS="$ARGS --replicas 1"
                      [ "$INACT" -gt 0 ] && [ "$INACT" -le "$THRESHOLD_NS" ] || ARGS="$ARGS --inactive-threshold 168h"
                      if [ -z "$ARGS" ]; then ALREADY=$((ALREADY + 1)); continue; fi
                      if $NATS consumer edit "$S" "$C" $ARGS -f >/dev/null 2>&1; then
                        echo "edited $S/$C:$ARGS"; EDITED=$((EDITED + 1))
                      else
                        echo "WARN: edit failed $S/$C:$ARGS"; FAILED=$((FAILED + 1))
                      fi
                    done
                  done
                  echo "consumers: edited=$EDITED within_policy=$ALREADY failed=$FAILED streams_skipped=$SKIPPED"
                  [ "$FAILED" -eq 0 ]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
