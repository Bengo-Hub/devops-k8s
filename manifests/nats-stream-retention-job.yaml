# NATS JetStream Stream Retention Enforcement
#
# Runs every 6 hours to ensure all application streams have consistent
# retention policies. Prevents JetStream PVC (10Gi) from filling up.
#
# Policy: MaxAge=7 days, MaxBytes=2GiB per stream.
# DLQ streams: MaxAge=14 days (longer retention for failed-event investigation).
#
# Streams managed:
#   auth, ordering, logistics, inventory, treasury, pos, notifications,
#   subscriptions, projects, iot, ticketing, marketflow
#   + DLQ variants: logistics-dlq, treasury-dlq, inventory-dlq, pos-dlq,
#                   projects-dlq, iot-dlq
#
# NOTE: This job uses "nats stream update" which only changes retention settings,
# it does NOT delete or recreate streams. Safe to run on a live cluster.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nats-stream-retention
  namespace: messaging
  labels:
    app: nats-stream-retention
    component: maintenance
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      activeDeadlineSeconds: 300
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: nats-stream-retention
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nats-cli
              image: natsio/nats-box:0.14.5
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  NATS_URL="nats://nats.messaging.svc.cluster.local:4222"
                  MAX_AGE="7d"
                  MAX_BYTES="2147483648"   # 2GiB
                  DLQ_MAX_AGE="14d"
                  DLQ_MAX_BYTES="536870912"  # 512MiB — DLQ should be small

                  echo "=== NATS Stream Retention Enforcement ($(date -u)) ==="
                  echo "Policy: MaxAge=${MAX_AGE}, MaxBytes=${MAX_BYTES} bytes"
                  echo ""

                  # Update or create stream with retention policy
                  apply_retention() {
                    local STREAM="$1"
                    local SUBJECTS="$2"
                    local AGE="$3"
                    local BYTES="$4"

                    echo "Processing stream: ${STREAM} (subjects: ${SUBJECTS})"
                    if nats --server="${NATS_URL}" stream info "${STREAM}" > /dev/null 2>&1; then
                      nats --server="${NATS_URL}" stream edit "${STREAM}" \
                        --max-age="${AGE}" \
                        --max-bytes="${BYTES}" \
                        --ack \
                        2>&1 || echo "  WARN: Could not update ${STREAM} — may need manual review"
                      echo "  Updated: ${STREAM}"
                    else
                      echo "  Stream ${STREAM} does not exist yet — will be created by the application on next startup"
                    fi
                  }

                  # Application streams (7d retention, 2GiB max)
                  apply_retention "auth"           "auth.>"                   "${MAX_AGE}" "${MAX_BYTES}"
                  apply_retention "ordering"        "ordering.>"              "${MAX_AGE}" "${MAX_BYTES}"
                  apply_retention "logistics"       "logistics.>"             "${MAX_AGE}" "${MAX_BYTES}"
                  apply_retention "inventory"       "inventory.>"             "${MAX_AGE}" "${MAX_BYTES}"
                  apply_retention "treasury"        "treasury.>"              "${MAX_AGE}" "${MAX_BYTES}"
                  apply_retention "pos"             "pos.>"                   "${MAX_AGE}" "${MAX_BYTES}"
                  apply_retention "notifications"   "notifications.>"         "${MAX_AGE}" "${MAX_BYTES}"
                  apply_retention "subscription"    "subscription.>"          "${MAX_AGE}" "${MAX_BYTES}"
                  apply_retention "projects"        "projects.>"              "${MAX_AGE}" "${MAX_BYTES}"
                  apply_retention "ticketing"       "ticketing.>"             "${MAX_AGE}" "${MAX_BYTES}"
                  apply_retention "marketflow"      "marketflow.>"            "${MAX_AGE}" "${MAX_BYTES}"

                  # DLQ streams (14d retention, 512MiB — less frequent, kept longer for debugging)
                  apply_retention "logistics-dlq"   "logistics.dlq.>"         "${DLQ_MAX_AGE}" "${DLQ_MAX_BYTES}"
                  apply_retention "treasury-dlq"    "treasury.dlq.>"          "${DLQ_MAX_AGE}" "${DLQ_MAX_BYTES}"
                  apply_retention "inventory-dlq"   "inventory.dlq.>"         "${DLQ_MAX_AGE}" "${DLQ_MAX_BYTES}"
                  apply_retention "pos-dlq"         "pos.dlq.>"               "${DLQ_MAX_AGE}" "${DLQ_MAX_BYTES}"
                  apply_retention "projects-dlq"    "projects.dlq.>"          "${DLQ_MAX_AGE}" "${DLQ_MAX_BYTES}"

                  echo ""
                  echo "=== Stream Status After Update ==="
                  nats --server="${NATS_URL}" stream ls 2>/dev/null || true
                  echo "=== Done ==="
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
---
# NATS JetStream consumer replica enforcement (2026-11-06)
#
# All 3 nats pods run on the one node, so an R3 consumer gives no node-level
# protection, only cover for one nats pod crashing. It does cost raft traffic:
# ~460 route messages a second and ~800m of CPU across the pods with almost no
# client traffic, about a quarter of all real CPU on the node. Streams stay R3 so
# message data remains replicated; consumers run R1. An R1 consumer whose nats pod
# restarts resumes from its on-disk state when the pod is back.
#
# Enforced here rather than in shared/events: it covers every client (Go, .NET,
# nats.js, Python) and consumers created later. nats.go only compares replicas when
# the client sets them, so services re-binding to an R1 durable keep working, and
# setting nats.ConsumerReplicas(1) in the library would make binds to existing R3
# durables fail.
#
# Limits-retention streams only: the server requires consumer replicas to match the
# stream on interest and work-queue streams, so those are skipped. Idempotent.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nats-consumer-replicas
  namespace: messaging
  labels:
    app: nats-consumer-replicas
    component: maintenance
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 7200
      activeDeadlineSeconds: 1200
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: nats-consumer-replicas
        spec:
          restartPolicy: Never
          containers:
            - name: nats-cli
              image: natsio/nats-box:0.14.5
              env:
                # Rollout stage: only these streams. Empty means every stream.
                - name: ONLY_STREAMS
                  value: "library auth notifications"
              command:
                - /bin/sh
                - -c
                - |
                  NATS="nats --server=nats://nats.messaging.svc.cluster.local:4222"
                  STREAMS="${ONLY_STREAMS:-$($NATS stream ls -n 2>/dev/null)}"
                  [ -n "$STREAMS" ] || { echo "ERROR: could not list streams"; exit 1; }
                  EDITED=0; ALREADY=0; SKIPPED=0; FAILED=0
                  for S in $STREAMS; do
                    case "$($NATS stream info "$S" --json 2>/dev/null)" in
                      *'"retention": "limits"'*) ;;
                      *) echo "skip stream $S: not limits retention or info failed"; SKIPPED=$((SKIPPED + 1)); continue ;;
                    esac
                    for C in $($NATS consumer ls "$S" -n 2>/dev/null); do
                      INFO=$($NATS consumer info "$S" "$C" --json 2>/dev/null) || { echo "WARN: info failed $S/$C"; FAILED=$((FAILED + 1)); continue; }
                      case "$INFO" in
                        *'"num_replicas": 1'*) ALREADY=$((ALREADY + 1)) ;;
                        *)
                          if $NATS consumer edit "$S" "$C" --replicas 1 -f >/dev/null 2>&1; then
                            echo "edited $S/$C"; EDITED=$((EDITED + 1))
                          else
                            echo "WARN: edit failed $S/$C"; FAILED=$((FAILED + 1))
                          fi
                          ;;
                      esac
                    done
                  done
                  echo "consumers: edited=$EDITED already_r1=$ALREADY failed=$FAILED streams_skipped=$SKIPPED"
                  [ "$FAILED" -eq 0 ]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
